        }

        function TeacherView({ currentTeacher, setCurrentTeacher, teachers, setTeachers, reports, setReports, showToast, triggerConfetti, setActiveImageModal }) {
            // Teacher Login State
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');

            // Grading Modal / Active Report State
            const [inspectingReport, setInspectingReport] = useState(null);
            const [scoreInput, setScoreInput] = useState(10);
            const [commentInput, setCommentInput] = useState('');

            // Search & Filter
            const [filterStatus, setFilterStatus] = useState('all'); // 'all', 'pending', 'reviewed'
            const [searchQuery, setSearchQuery] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                const found = teachers.find(t => t.username === loginUser && t.password === loginPass);
                if (found) {
                    setCurrentTeacher(found);
                    showToast(`ยินดีต้อนรับ ${found.name}`);
                } else {
                    showToast('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง', 'error');
                }
            };

            const openGradeModal = (report) => {
                setInspectingReport(report);
                setScoreInput(report.score || 10);
                setCommentInput(report.teacherComment || 'ทำความสะอาดเรียบร้อยดีมากครับ');
            };

            const handleSaveGrade = (e) => {
                e.preventDefault();
                if (!inspectingReport) return;

                const now = new Date();
                const formattedTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const updatedReports = reports.map(r => {
                    if (r.id === inspectingReport.id) {
                        return {
                            ...r,
                            inspectionStatus: 'ตรวจแล้ว',
                            score: Number(scoreInput),
                            teacherComment: commentInput,
                            inspectedBy: currentTeacher.name,
                            inspectedAt: formattedTime
                        };
                    }
                    return r;
                });

                setReports(updatedReports);
                setInspectingReport(null);
                triggerConfetti();
                showToast('บันทึกผลการตรวจเวรสำเร็จ!');
            };

            // Filtered Reports
            const filteredReports = useMemo(() => {
                return reports.filter(r => {
                    const matchesStatus = 
                        filterStatus === 'all' ? true :
                        filterStatus === 'pending' ? r.inspectionStatus === 'รอการตรวจ' :
                        r.inspectionStatus === 'ตรวจแล้ว';

                    const matchesSearch = 
                        r.studentName.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        r.location.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        r.classGrade.toLowerCase().includes(searchQuery.toLowerCase());

                    return matchesStatus && matchesSearch;
                });
            }, [reports, filterStatus, searchQuery]);

            // Quick Stats
            const pendingCount = reports.filter(r => r.inspectionStatus === 'รอการตรวจ').length;
            const reviewedCount = reports.filter(r => r.inspectionStatus === 'ตรวจแล้ว').length;

            // If teacher is NOT logged in
            if (!currentTeacher) {
                return (
                    <div className="max-w-md mx-auto my-8 animate-fade-in">
                        <div className="glass-card rounded-3xl p-8 shadow-floating border border-white space-y-6">
                            <div className="text-center space-y-2">
                                <div className="w-16 h-16 bg-pink-100 text-pink-600 rounded-3xl mx-auto flex items-center justify-center text-2xl shadow-inner">
                                    <i className="fa-solid fa-chalkboard-user"></i>
                                </div>
                                <h2 className="text-2xl font-bold font-kanit text-slate-800">เข้าสู่ระบบสำหรับครู</h2>
                                <p className="text-xs text-slate-500">กรุณาเข้าสู่ระบบเพื่อตรวจและประเมินเวรประจำจุด</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">ชื่อผู้ใช้งาน (Username)</label>
                                    <input
                                        type="text"
                                        required
                                        placeholder="เช่น somchai"
                                        value={loginUser}
                                        onChange={e => setLoginUser(e.target.value)}
                                        className="w-full px-4 py-3 rounded-2xl glass-input text-sm"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่าน (Password)</label>
                                    <input
                                        type="password"
                                        required
                                        placeholder="••••••••"
                                        value={loginPass}
                                        onChange={e => setLoginPass(e.target.value)}
                                        className="w-full px-4 py-3 rounded-2xl glass-input text-sm"
                                    />
                                </div>

                                <button
                                    type="submit"
                                    className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold text-sm shadow-md hover:opacity-95 transition-all font-kanit"
                                >
                                    เข้าสู่ระบบ
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // Teacher Dashboard when logged in
            return (
                <div className="space-y-6 animate-fade-in">
                    {/* Teacher Top Bar Header */}
                    <div className="glass-card rounded-3xl p-6 shadow-card border border-white flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div className="flex items-center space-x-4">
                            <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-400 to-purple-500 text-white flex items-center justify-center text-2xl font-bold shadow-md">
                                <i className="fa-solid fa-user-tie"></i>
                            </div>
                            <div>
                                <h2 className="text-xl font-bold text-slate-800 font-kanit">{currentTeacher.name}</h2>
                                <p className="text-xs text-purple-600 font-medium">กลุ่มสาระการเรียนรู้{currentTeacher.subject}</p>
                            </div>
                        </div>

                        <button
                            onClick={() => { setCurrentTeacher(null); showToast('ออกจากระบบเรียบร้อย'); }}
                            className="px-4 py-2 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold transition-colors flex items-center gap-1.5"
                        >
                            <i className="fa-solid fa-right-from-bracket"></i>
                            ออกจากระบบ
                        </button>
                    </div>

                    {/* KPI Stat Cards */}
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                        <div className="glass-card p-5 rounded-3xl border border-white flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-400">รายงานทั้งหมด</p>
                                <p className="text-2xl font-bold text-slate-800 font-kanit">{reports.length}</p>
                            </div>
                            <div className="w-10 h-10 rounded-2xl bg-purple-100 text-purple-600 flex items-center justify-center text-lg">
                                <i className="fa-solid fa-inbox"></i>
                            </div>
                        </div>

                        <div className="glass-card p-5 rounded-3xl border border-white flex items-center justify-between">
                            <div>
                                <p className="text-xs font-semibold text-slate-400">รอการตรวจ</p>
                                <p className="text-2xl font-bold text-amber-600 font-kanit">{pendingCount}</p>
                            </div>
                            <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-600 flex items-center justify-center text-lg">
                                <i className="fa-solid fa-hourglass-half"></i>
                            </div>
                        </div>

                        <div className="glass-card p-5 rounded-3xl border border-white flex items-center justify-between col-span-2 md:col-span-1">
                            <div>
                                <p className="text-xs font-semibold text-slate-400">ตรวจแล้ว</p>
                                <p className="text-2xl font-bold text-emerald-600 font-kanit">{reviewedCount}</p>
                            </div>
                            <div className="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">
                                <i className="fa-solid fa-circle-check"></i>
                            </div>
                        </div>
                    </div>

                    {/* Search & Filter Controls */}
                    <div className="glass-card rounded-2xl p-4 border border-white flex flex-col md:flex-row gap-3 items-center justify-between">
                        <div className="relative w-full md:w-72">
                            <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                            <input
                                type="text"
                                placeholder="ค้นหาชื่อนักเรียน / จุดเวร..."
                                value={searchQuery}
                                onChange={e => setSearchQuery(e.target.value)}
                                className="w-full pl-9 pr-4 py-2.5 rounded-xl glass-input text-xs"
                            />
                        </div>

                        <div className="flex space-x-2 w-full md:w-auto">
                            {[
                                { id: 'all', label: 'ทั้งหมด' },
                                { id: 'pending', label: '⏳ รอตรวจ' },
                                { id: 'reviewed', label: '✅ ตรวจแล้ว' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setFilterStatus(tab.id)}
                                    className={`flex-1 md:flex-none px-4 py-2 rounded-xl text-xs font-semibold transition-all ${
                                        filterStatus === tab.id
                                            ? 'bg-purple-600 text-white shadow-sm'
                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>
                    </div>

                    {filteredReports.length === 0 ? (
                        <div className="glass-card rounded-3xl p-12 text-center text-slate-400">
                            <i className="fa-solid fa-clipboard-check text-4xl mb-3 text-purple-200"></i>
                            <p className="text-sm">ไม่พบรายการส่งเวรในหมวดหมู่นี้</p>
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                            {filteredReports.map(item => (
                                <div key={item.id} className="glass-card rounded-3xl p-5 shadow-card border border-white flex flex-col justify-between hover:shadow-md transition-shadow">
                                    <div>
                                        {/* Status Header */}
                                        <div className="flex items-center justify-between mb-3">
                                            <span className="text-xs font-bold px-3 py-1 rounded-full bg-purple-100 text-purple-800">
                                                📍 {item.location}
                                            </span>
                                            {item.inspectionStatus === 'ตรวจแล้ว' ? (
                                                <span className="text-[11px] font-bold text-emerald-700 bg-emerald-100 px-2.5 py-0.5 rounded-full">
                                                    ตรวจแล้ว
                                                </span>
                                            ) : (
                                                <span className="text-[11px] font-bold text-amber-800 bg-amber-100 px-2.5 py-0.5 rounded-full animate-pulse">
                                                    รอตรวจ
                                                </span>
                                            )}
                                        </div>

                                        {/* Student Info */}
                                        <h4 className="font-bold text-slate-800 text-sm font-kanit">{item.studentName}</h4>
                                        <p className="text-xs text-slate-400 mb-2">
                                            {item.classGrade && item.studentNo ? `ชั้น ${item.classGrade} เลขที่ ${item.studentNo} • ` : ''}{item.timestamp}
                                        </p>

                                        {/* Attendance detail */}
                                        <div className="mb-3">
                                            {item.status === 'มาทำครบ' ? (
                                                <span className="text-[11px] text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-medium">
                                                    ✅ สมาชิกมาทำครบ
                                                </span>
                                            ) : (
                                                <div className="text-[11px] text-rose-800 bg-rose-50 p-2 rounded-xl border border-rose-200">
                                                    <p className="font-bold">⚠️ มาทำไม่ครบ:</p>
                                                    <p className="text-rose-700 mt-0.5">{item.absentMembersReason}</p>
                                                </div>
                                            )}
                                        </div>

                                        {/* Photo Thumbnail */}
                                        <div className="relative rounded-2xl overflow-hidden h-36 mb-4 bg-slate-100 border border-slate-200 group">
                                            <img src={item.photoUrl || DEFAULT_IMAGE_PLACEHOLDER} alt="Duty" className="w-full h-full object-cover" />
                                            {item.photoUrl && (
                                                <button
                                                    onClick={() => setActiveImageModal(item.photoUrl)}
                                                    className="absolute inset-0 bg-black/40 text-white opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-xs font-medium"
                                                >
                                                    <i className="fa-solid fa-expand mr-1.5"></i>
                                                    ขยายรูปภาพ
                                                </button>
                                            )}
                                        </div>
                                    </div>

                                    {/* Action / Inspection Info */}
                                    <div className="pt-3 border-t border-slate-100">
                                        {item.inspectionStatus === 'ตรวจแล้ว' ? (
                                            <div className="space-y-2">
                                                <div className="flex items-center justify-between text-xs">
                                                    <span className="font-semibold text-purple-900">คะแนนที่ได้:</span>
                                                    <span className="font-extrabold text-amber-600 bg-amber-50 px-2.5 py-0.5 rounded-full border border-amber-200">
                                                        ⭐ {item.score} / 10
                                                    </span>
                                                </div>
                                                {item.teacherComment && (
                                                    <p className="text-[11px] text-slate-600 italic bg-slate-50 p-2 rounded-xl">
                                                        "{item.teacherComment}"
                                                    </p>
                                                )}
                                                <button
                                                    onClick={() => openGradeModal(item)}
                                                    className="w-full py-2 mt-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition-colors"
                                                >
                                                    แก้ไขผลการตรวจ
                                                </button>
                                            </div>
                                        ) : (
                                            <button
                                                onClick={() => openGradeModal(item)}
                                                className="w-full py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-pink-500 text-white font-bold text-xs shadow-md hover:opacity-95 transition-all font-kanit flex items-center justify-center gap-1.5"
                                            >
                                                <i className="fa-solid fa-pen-to-square"></i>
                                                ตรวจเวร & ให้คะแนน
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}

                    {/* Grading Modal */}
                    {inspectingReport && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-floating space-y-5 border border-white max-h-[90vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                    <h3 className="text-lg font-bold font-kanit text-slate-800">
                                        ตรวจเวร: {inspectingReport.location}
                                    </h3>
                                    <button 
                                        onClick={() => setInspectingReport(null)}
                                        className="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center"
                                    >
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>
                                </div>

                                <div className="space-y-3">
                                    <div className="flex items-center space-x-3 bg-purple-50 p-3 rounded-2xl">
                                        <img src={inspectingReport.photoUrl || DEFAULT_IMAGE_PLACEHOLDER} alt="Duty" className="w-16 h-16 rounded-xl object-cover" />
                                        <div className="text-xs">
                                            <p className="font-bold text-slate-800 text-sm">{inspectingReport.studentName}</p>
                                            {inspectingReport.classGrade && inspectingReport.studentNo && (
                                                <p className="text-slate-500">ชั้น {inspectingReport.classGrade} เลขที่ {inspectingReport.studentNo}</p>
                                            )}
                                            <p className="text-purple-700 font-medium">ส่งเมื่อ: {inspectingReport.timestamp}</p>
                                        </div>
                                    </div>

                                    {/* Score Input Slider */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-2">
                                            ให้คะแนนความสะอาด (1 - 10 คะแนน) *
                                        </label>
                                        <div className="flex items-center space-x-4">
                                            <input
                                                type="range"
                                                min="1"
                                                max="10"
                                                value={scoreInput}
                                                onChange={e => setScoreInput(e.target.value)}
                                                className="w-full accent-purple-600 cursor-pointer"
                                            />
                                            <span className="w-12 h-10 rounded-xl bg-amber-400 text-slate-900 font-black text-lg flex items-center justify-center shadow-sm">
                                                {scoreInput}
                                            </span>
                                        </div>
                                    </div>

                                    {/* Quick Feedback Presets */}
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1">เลือกข้อความชมเชย/แนะนำด่วน:</label>
                                        <div className="flex flex-wrap gap-1.5">
                                            {[
                                                'ทำความสะอาดเรียบร้อยดีมากครับ!',
                                                'กวาดขยะและจัดสถานที่ได้เป็นระเบียบ',
                                                'ควรเก็บเศษขยะซอกมุมเพิ่มเติมอีกนิดครับ',
                                                'ขอบคุณที่ตั้งใจปฏิบัติหน้าที่อย่างแข็งขัน'
                                            ].map((preset, idx) => (
                                                <button
                                                    key={idx}
                                                    type="button"
                                                    onClick={() => setCommentInput(preset)}
                                                    className="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-purple-100 text-slate-700 text-[11px] font-medium transition-colors"
                                                >
                                                    + {preset}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Feedback Comment */}
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">
                                            ข้อคิดเห็น / คำแนะนำถึงนักเรียน
                                        </label>
                                        <textarea
                                            rows="3"
                                            placeholder="กรอกคำแนะนำหรือข้อคิดเห็น..."
                                            value={commentInput}
                                            onChange={e => setCommentInput(e.target.value)}
                                            className="w-full p-3 rounded-2xl glass-input text-sm"
                                        ></textarea>
                                    </div>

                                    <button
                                        type="button"
                                        onClick={handleSaveGrade}
                                        className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-bold text-sm shadow-md hover:opacity-95 transition-all font-kanit"
                                    >
                                        บันทึกการตรวจเวร
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function AdminView({ isAdminLoggedIn, setIsAdminLoggedIn, locations, setLocations, teachers, setTeachers, reports, setReports, showToast }) {
            const [adminPassInput, setAdminPassInput] = useState('');
            const [adminSubTab, setAdminSubTab] = useState('analytics'); // 'analytics', 'locations', 'teachers', 'all_reports'

            // Form inputs
            const [newLocName, setNewLocName] = useState('');
            const [editingLocIndex, setEditingLocIndex] = useState(null);
            const [editLocName, setEditLocName] = useState('');

            // Teacher form inputs
            const [newTeacherName, setNewTeacherName] = useState('');
            const [newTeacherSub, setNewTeacherSub] = useState('');
            const [newTeacherUser, setNewTeacherUser] = useState('');
            const [newTeacherPass, setNewTeacherPass] = useState('');

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPassInput === '9321') {
                    setIsAdminLoggedIn(true);
                    showToast('เข้าสู่ระบบผู้ดูแลระบบสำเร็จ!');
                } else {
                    showToast('รหัสผ่านผู้ดูแลระบบไม่ถูกต้อง', 'error');
                }
            };

            // Add Location
            const handleAddLocation = (e) => {
                e.preventDefault();
                if (!newLocName.trim()) return;
                if (locations.includes(newLocName.trim())) {
                    showToast('จุดเวรนี้มีอยู่ในระบบแล้ว', 'error');
                    return;
                }
                setLocations([...locations, newLocName.trim()]);
                setNewLocName('');
                showToast('เพิ่มจุดทำเวรใหม่เรียบร้อย!');
            };

            // Edit Location
            const handleSaveEditLocation = (index) => {
                if (!editLocName.trim()) return;
                const updated = [...locations];
                updated[index] = editLocName.trim();
                setLocations(updated);
                setEditingLocIndex(null);
                showToast('แก้ไขชื่อจุดทำเวรสำเร็จ!');
            };

            // Delete Location
            const handleDeleteLocation = (locName) => {
                setLocations(locations.filter(l => l !== locName));
                showToast(`ลบจุดทำเวร ${locName} แล้ว`);
            };

            // Add Teacher
            const handleAddTeacher = (e) => {
                e.preventDefault();
                if (!newTeacherName.trim() || !newTeacherUser.trim() || !newTeacherPass.trim()) {
                    showToast('กรุณากรอกข้อมูลครูให้ครบถ้วน', 'error');
                    return;
                }
                const newT = {
                    id: 't-' + Date.now(),
                    name: newTeacherName.trim(),
                    subject: newTeacherSub.trim() || 'ทั่วไป',
                    username: newTeacherUser.trim(),
                    password: newTeacherPass.trim()
                };
                setTeachers([...teachers, newT]);
                setNewTeacherName('');
                setNewTeacherSub('');
                setNewTeacherUser('');
                setNewTeacherPass('');
                showToast('เพิ่มข้อมูลครูผู้ตรวจเวรสำเร็จ!');
            };

            // Delete Teacher
            const handleDeleteTeacher = (id) => {
                setTeachers(teachers.filter(t => t.id !== id));
                showToast('ลบข้อมูลครูเรียบร้อยแล้ว');
            };

            // Delete Report
            const handleDeleteReport = (id) => {
                setReports(reports.filter(r => r.id !== id));
                showToast('ลบรายงานออกจากระบบแล้ว');
            };

            // Admin Login Form
            if (!isAdminLoggedIn) {
                return (
                    <div className="max-w-md mx-auto my-8 animate-fade-in">
                        <div className="glass-card rounded-3xl p-8 shadow-floating border border-white space-y-6">
                            <div className="text-center space-y-2">
                                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-3xl mx-auto flex items-center justify-center text-2xl shadow-inner">
                                    <i className="fa-solid fa-user-shield text-amber-600"></i>
                                </div>
                                <h2 className="text-2xl font-bold font-kanit text-slate-800">ผู้ดูแลระบบ (Admin)</h2>
                                <p className="text-xs text-slate-500">กรุณาใส่รหัสผ่านเพื่อเข้าสู่ระบบจัดการระบบ</p>
                            </div>

                            <form onSubmit={handleAdminLogin} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 mb-1">รหัสผ่านแอดมิน (Admin Password)</label>
                                    <input
                                        type="password"
                                        required
                                        placeholder="••••"
                                        value={adminPassInput}
                                        onChange={e => setAdminPassInput(e.target.value)}
                                        className="w-full px-4 py-3 rounded-2xl glass-input text-sm text-center font-bold tracking-widest text-lg"
                                    />
                                </div>

                                <button
                                    type="submit"
                                    className="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-500 to-orange-500 text-white font-bold text-sm shadow-md hover:opacity-95 transition-all font-kanit"
                                >
                                    เข้าสู่ระบบแอดมิน
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // Analytics Stats Calculation
            const totalSubmissions = reports.length;
            const completedDutyCount = reports.filter(r => r.status === 'มาทำครบ').length;
            const incompleteDutyCount = reports.filter(r => r.status === 'มาทำไม่ครบ').length;
            const reviewedCount = reports.filter(r => r.inspectionStatus === 'ตรวจแล้ว').length;

            // Location breakdown calculation
            const locationStats = locations.map(loc => {
                const locReports = reports.filter(r => r.location === loc);
                return {
                    name: loc,
                    count: locReports.length
                };
            }).sort((a,b) => b.count - a.count);

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* Admin Header */}
                    <div className="glass-card rounded-3xl p-6 shadow-card border border-white flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
                        <div className="flex items-center space-x-4">
                            <div className="w-14 h-14 rounded-2xl bg-amber-400 text-slate-900 flex items-center justify-center text-2xl font-bold shadow-md">
                                <i className="fa-solid fa-user-gear"></i>
                            </div>
                            <div>
                                <h2 className="text-xl font-bold text-slate-800 font-kanit">แผงควบคุมผู้ดูแลระบบ</h2>
                                <p className="text-xs text-amber-700 font-medium">จัดการสถานที่, ครูผู้ตรวจ และภาพรวมสถิติโรงเรียน</p>
                            </div>
                        </div>

                        <button
                            onClick={() => { setIsAdminLoggedIn(false); showToast('ออกจากระบบแอดมิน'); }}
                            className="px-4 py-2 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold transition-colors flex items-center gap-1.5"
                        >
                            <i className="fa-solid fa-right-from-bracket"></i>
                            ออกจากระบบแอดมิน
                        </button>
                    </div>

                    {/* Admin Sub Navigation */}
                    <div className="flex flex-wrap gap-2 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200">
                        {[
                            { id: 'analytics', label: '📊 ภาพรวมสถิติ' },
                            { id: 'locations', label: '📍 จัดการจุดทำเวร' },
                            { id: 'teachers', label: '👨‍🏫 จัดการข้อมูลครู' },
                            { id: 'all_reports', label: '📂 รายงานทั้งหมด' }
                        ].map(sub => (
                            <button
                                key={sub.id}
                                onClick={() => setAdminSubTab(sub.id)}
                                className={`px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-2 ${
                                    adminSubTab === sub.id
                                        ? 'bg-white text-purple-700 shadow-sm'
                                        : 'text-slate-600 hover:text-purple-600 hover:bg-white/50'
                                }`}
                            >
                                <span>{sub.label}</span>
                            </button>
                        ))}
                    </div>

                    {/* SUB TAB 1: Analytics */}
                    {adminSubTab === 'analytics' && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                <div className="glass-card p-5 rounded-3xl border border-white">
                                    <p className="text-xs text-slate-400 font-semibold">รายการรายงานรวม</p>
                                    <p className="text-2xl font-bold text-purple-700 font-kanit mt-1">{totalSubmissions}</p>
                                </div>
                                <div className="glass-card p-5 rounded-3xl border border-white">
                                    <p className="text-xs text-slate-400 font-semibold">มาทำเวรครบ</p>
                                    <p className="text-2xl font-bold text-emerald-600 font-kanit mt-1">{completedDutyCount}</p>
                                </div>
                                <div className="glass-card p-5 rounded-3xl border border-white">
                                    <p className="text-xs text-slate-400 font-semibold">มาทำไม่ครบ</p>
                                    <p className="text-2xl font-bold text-rose-500 font-kanit mt-1">{incompleteDutyCount}</p>
                                </div>
                                <div className="glass-card p-5 rounded-3xl border border-white">
                                    <p className="text-xs text-slate-400 font-semibold">ได้รับการตรวจแล้ว</p>
                                    <p className="text-2xl font-bold text-amber-600 font-kanit mt-1">{reviewedCount}</p>
                                </div>
                            </div>

                            {/* Location Duty Popularity Bar Chart */}
                            <div className="glass-card p-6 rounded-3xl border border-white space-y-4">
                                <h3 className="text-base font-bold text-slate-800 font-kanit">
                                    สรุปการส่งรายงานเวรแยกตามจุดประจำ
                                </h3>
                                <div className="space-y-3">
                                    {locationStats.map((item) => {
                                        const maxCount = locationStats[0]?.count || 1;
                                        const percent = Math.round((item.count / (maxCount || 1)) * 100);

                                        return (
                                            <div key={item.name} className="space-y-1">
                                                <div className="flex justify-between text-xs font-semibold">
                                                    <span className="text-slate-700">📍 {item.name}</span>
                                                    <span className="text-purple-700">{item.count} รายงาน</span>
                                                </div>
                                                <div className="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                                                    <div
                                                        className="bg-gradient-to-r from-purple-500 to-pink-400 h-full rounded-full transition-all duration-500"
                                                        style={{ width: `${percent}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SUB TAB 2: Location Management */}
                    {adminSubTab === 'locations' && (
                        <div className="glass-card p-6 rounded-3xl border border-white space-y-6">
                            <h3 className="text-base font-bold text-slate-800 font-kanit">จัดการสถานที่ / จุดประจำเวร</h3>

                            {/* Add Location Form */}
                            <form onSubmit={handleAddLocation} className="flex gap-2">
                                <input
                                    type="text"
                                    required
                                    placeholder="เพิ่มจุดเวรใหม่ เช่น อาคารเอนกประสงค์..."
                                    value={newLocName}
                                    onChange={e => setNewLocName(e.target.value)}
                                    className="flex-1 px-4 py-2.5 rounded-2xl glass-input text-sm"
                                />
                                <button
                                    type="submit"
                                    className="px-5 py-2.5 rounded-2xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs shadow-sm transition-colors font-kanit"
                                >
                                    + เพิ่มจุดเวร
                                </button>
                            </form>

                            {/* Location List Table */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                {locations.map((loc, idx) => (
                                    <div key={idx} className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center justify-between">
                                        {editingLocIndex === idx ? (
                                            <div className="flex items-center gap-2 w-full">
                                                <input
                                                    type="text"
                                                    value={editLocName}
                                                    onChange={e => setEditLocName(e.target.value)}
                                                    className="flex-1 px-3 py-1 rounded-xl text-xs glass-input"
                                                />
                                                <button
                                                    onClick={() => handleSaveEditLocation(idx)}
                                                    className="px-3 py-1 rounded-xl bg-emerald-500 text-white text-xs font-bold"
                                                >
                                                    บันทึก
                                                </button>
                                                <button
                                                    onClick={() => setEditingLocIndex(null)}
                                                    className="px-2 py-1 rounded-xl bg-slate-200 text-slate-600 text-xs"
                                                >
                                                    ยกเลิก
                                                </button>
                                            </div>
                                        ) : (
                                            <>
                                                <span className="text-xs font-bold text-slate-700">📍 {loc}</span>
                                                <div className="flex items-center space-x-1">
                                                    <button
                                                        onClick={() => { setEditingLocIndex(idx); setEditLocName(loc); }}
                                                        className="w-8 h-8 rounded-xl bg-amber-100 text-amber-700 hover:bg-amber-200 flex items-center justify-center text-xs"
                                                    >
                                                        <i className="fa-solid fa-pen"></i>
                                                    </button>
                                                    <button
                                                        onClick={() => handleDeleteLocation(loc)}
                                                        className="w-8 h-8 rounded-xl bg-rose-100 text-rose-700 hover:bg-rose-200 flex items-center justify-center text-xs"
                                                    >
                                                        <i className="fa-solid fa-trash"></i>
                                                    </button>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* SUB TAB 3: Teacher Management */}
                    {adminSubTab === 'teachers' && (
                        <div className="glass-card p-6 rounded-3xl border border-white space-y-6">
                            <h3 className="text-base font-bold text-slate-800 font-kanit">จัดการข้อมูลครูประจำการ</h3>

                            {/* Add Teacher Form */}
                            <form onSubmit={handleAddTeacher} className="p-4 rounded-2xl bg-purple-50/60 border border-purple-100 space-y-3">
                                <h4 className="text-xs font-bold text-purple-900 uppercase tracking-wider">เพิ่มครูประจำการใหม่</h4>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <input
                                        type="text"
                                        placeholder="ชื่อ-นามสกุล (เช่น ครูรัตนา มีสุข)"
                                        value={newTeacherName}
                                        onChange={e => setNewTeacherName(e.target.value)}
                                        className="px-4 py-2.5 rounded-xl glass-input text-xs"
                                    />
                                    <input
                                        type="text"
                                        placeholder="กลุ่มสาระ/วิชาที่สอน (เช่น คณิตศาสตร์)"
                                        value={newTeacherSub}
                                        onChange={e => setNewTeacherSub(e.target.value)}
                                        className="px-4 py-2.5 rounded-xl glass-input text-xs"
                                    />
                                    <input
                                        type="text"
                                        placeholder="Username"
                                        value={newTeacherUser}
                                        onChange={e => setNewTeacherUser(e.target.value)}
                                        className="px-4 py-2.5 rounded-xl glass-input text-xs"
                                    />
                                    <input
                                        type="text"
                                        placeholder="Password"
                                        value={newTeacherPass}
                                        onChange={e => setNewTeacherPass(e.target.value)}
                                        className="px-4 py-2.5 rounded-xl glass-input text-xs"
                                    />
                                </div>
                                <button
                                    type="submit"
                                    className="px-5 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs transition-colors font-kanit"
                                >
                                    + บันทึกเพิ่มครูใหม่
                                </button>
                            </form>

                            {/* Teacher Cards */}
                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                {teachers.map(t => (
                                    <div key={t.id} className="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 flex items-center justify-between">
                                        <div>
                                            <p className="font-bold text-xs text-slate-800">{t.name}</p>
                                            <p className="text-[11px] text-purple-600">วิชา {t.subject}</p>
                                            <p className="text-[10px] text-slate-400 font-mono mt-0.5">user: {t.username}</p>
                                        </div>
                                        <button
                                            onClick={() => handleDeleteTeacher(t.id)}
                                            className="w-8 h-8 rounded-xl bg-rose-100 text-rose-600 hover:bg-rose-200 flex items-center justify-center text-xs"
                                        >
                                            <i className="fa-solid fa-trash"></i>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* SUB TAB 4: All Submissions Management */}
                    {adminSubTab === 'all_reports' && (
                        <div className="glass-card p-6 rounded-3xl border border-white space-y-4">
                            <h3 className="text-base font-bold text-slate-800 font-kanit">จัดการรายการรายงานเวรทั้งหมด</h3>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs text-slate-600">
                                    <thead className="bg-purple-50 text-purple-900 font-bold uppercase tracking-wider rounded-xl">
                                        <tr>
                                            <th className="p-3 rounded-l-xl">ผู้รายงาน</th>
                                            <th className="p-3">จุดทำเวร</th>
                                            <th className="p-3">เวลาส่ง</th>
                                            <th className="p-3">สถานะเวร</th>
                                            <th className="p-3">ผลการตรวจ</th>
                                            <th className="p-3 text-right rounded-r-xl">จัดการ</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {reports.map(r => (
                                            <tr key={r.id} className="hover:bg-slate-50/80 transition-colors">
                                                <td className="p-3 font-medium text-slate-800">
                                                    {r.studentName} {r.classGrade ? <span className="text-[10px] text-slate-400">({r.classGrade})</span> : null}
                                                </td>
                                                <td className="p-3 font-semibold text-purple-800">{r.location}</td>
                                                <td className="p-3 text-slate-400">{r.timestamp}</td>
                                                <td className="p-3">
                                                    {r.status === 'มาทำครบ' ? (
                                                        <span className="text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded font-bold">มาทำครบ</span>
                                                    ) : (
                                                        <span className="text-rose-700 bg-rose-50 px-2 py-0.5 rounded font-bold">มาทำไม่ครบ</span>
                                                    )}
                                                </td>
                                                <td className="p-3">
                                                    {r.inspectionStatus === 'ตรวจแล้ว' ? (
                                                        <span className="text-emerald-600 font-bold">⭐ {r.score}/10</span>
                                                    ) : (
                                                        <span className="text-amber-600 font-bold">รอตรวจ</span>
                                                    )}
                                                </td>
                                                <td className="p-3 text-right">
                                                    <button
                                                        onClick={() => handleDeleteReport(r.id)}
                                                        className="px-2.5 py-1 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-700 font-bold text-[11px]"
                                                    >
                                                        ลบ
                                                    </button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
