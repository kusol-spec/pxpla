<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจความสะอาด</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #fff0f3; }
        .pink-card { background: #fff; border: 2px solid #fecdd3; }
        .pink-header { color: #e11d48; }
        .pink-btn { background: #f43f5e; color: #fff; }
        .pink-btn:hover { background: #e11d48; }
        .tab-active { background: #f43f5e !important; color: #fff !important; font-weight: bold; }
    </style>
</head>
<body class="p-3 md:p-6 flex flex-col items-center min-h-screen">

    <h1 class="text-2xl md:text-3xl font-bold pink-header my-3">🌸 ระบบตรวจความสะอาด 🌸</h1>

    <!-- เมนู 3 แท็บ -->
    <div class="flex gap-1 mb-4 w-full max-w-lg bg-pink-100 p-1.5 rounded-xl text-sm">
        <button onclick="switchTab('student')" id="tab-student" class="tab-btn tab-active flex-1 py-2 rounded-lg font-semibold text-rose-700">นักเรียน</button>
        <button onclick="switchTab('teacher')" id="tab-teacher" class="tab-btn flex-1 py-2 rounded-lg font-semibold text-rose-700">ครูตรวจงาน</button>
        <button onclick="switchTab('admin')" id="tab-admin" class="tab-btn flex-1 py-2 rounded-lg font-semibold text-rose-700">แอดมิน (8888)</button>
    </div>

    <div class="max-w-xl w-full pink-card p-5 rounded-2xl shadow-sm">

        <!-- แท็บ 1: นักเรียน -->
        <div id="content-student" class="tab-content space-y-3">
            <h2 class="font-bold pink-header border-b pb-2">📤 ส่งงานทำความสะอาด (รอการตรวจ)</h2>
            <form onsubmit="submitStudentWork(event)" class="space-y-3 text-sm">
                <div class="grid grid-cols-2 gap-2">
                    <input type="date" id="st-date" required class="p-2 border border-pink-200 rounded-lg w-full">
                    <input type="text" id="st-class" placeholder="ชั้น/ห้อง (ม.3/1)" required class="p-2 border border-pink-200 rounded-lg w-full">
                </div>
                <input type="text" id="st-sender" placeholder="ชื่อผู้ส่ง" required class="p-2 border border-pink-200 rounded-lg w-full">
                <input type="text" id="st-area" placeholder="สถานที่ (เช่น ห้อง 101)" required class="p-2 border border-pink-200 rounded-lg w-full">
                <input type="file" id="st-image" accept="image/*" class="p-1 border border-pink-200 rounded-lg w-full text-xs">
                <button type="submit" id="btn-st" class="w-full pink-btn py-2.5 rounded-xl font-bold">ส่งงานเข้าระบบ</button>
            </form>
        </div>

        <!-- แท็บ 2: ครู -->
        <div id="content-teacher" class="tab-content hidden space-y-3">
            <div id="tc-auth" class="space-y-3">
                <div class="flex justify-between items-center">
                    <h2 id="tc-auth-title" class="font-bold pink-header">🔐 เข้าสู่ระบบครู</h2>
                    <button onclick="toggleTcAuth()" id="tc-toggle-btn" class="text-xs text-rose-600 underline font-semibold">ยังไม่มีบัญชี? สมัครสมาชิกครู</button>
                </div>

                <!-- เข้าสู่ระบบ -->
                <form id="tc-login-form" onsubmit="loginTeacher(event)" class="space-y-2">
                    <input type="text" id="tc-user" placeholder="ระบุชื่อคุณครูที่ลงทะเบียนไว้" required class="p-2 border border-pink-200 rounded-lg w-full text-sm">
                    <button type="submit" class="w-full pink-btn py-2 rounded-lg font-bold text-sm">เข้าสู่ระบบ</button>
                </form>

                <!-- สมัครสมาชิกครู -->
                <form id="tc-reg-form" onsubmit="registerTeacher(event)" class="space-y-2 hidden">
                    <input type="text" id="tc-reg-name" placeholder="ชื่อ-นามสกุล คุณครูใหม่" required class="p-2 border border-pink-200 rounded-lg w-full text-sm">
                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 rounded-lg text-sm">📝 สมัครสมาชิกครู</button>
                </form>
            </div>

            <!-- ส่วนตรวจงานครู -->
            <div id="tc-main" class="hidden space-y-3">
                <div class="flex justify-between items-center text-sm border-b pb-2">
                    <span id="tc-welcome" class="font-bold pink-header">📋 รายการงานที่รอตรวจ</span>
                    <button onclick="loadJobs()" class="text-xs bg-rose-100 text-rose-700 px-2 py-1 rounded">🔄 รีเฟรช</button>
                </div>
                <select id="job-select" onchange="showSelectedJob()" class="p-2 border border-pink-200 rounded-lg w-full text-sm">
                    <option value="">-- เลือกลิสต์นักเรียนที่รอตรวจ --</option>
                </select>

                <div class="bg-gray-50 p-2 rounded-lg border text-center">
                    <p class="text-xs text-gray-500 mb-1">📸 รูปภาพผลงานนักเรียน:</p>
                    <img id="tc-img" src="https://via.placeholder.com/300x150?text=เลือกงานด้านบนเพื่อดูรูปภาพ" class="max-h-48 mx-auto object-contain rounded border">
                </div>

                <form onsubmit="submitGrade(event)" class="space-y-2 text-sm">
                    <label class="block text-xs font-bold text-rose-700">💯 ใส่คะแนนและให้คำแนะนำ:</label>
                    <input type="number" id="tc-score" min="0" max="10" placeholder="ระบุคะแนน (0-10)" required class="p-2 border border-pink-200 rounded-lg w-full text-center font-bold text-lg">
                    <textarea id="tc-comment" placeholder="คำแนะนำเพิ่มเติมสำหรับนักเรียน..." class="p-2 border border-pink-200 rounded-lg w-full text-xs"></textarea>
                    <button type="submit" class="w-full pink-btn py-2.5 rounded-lg font-bold">✅ บันทึกคะแนนและเปลี่ยนสถานะเป็นตรวจแล้ว</button>
                </form>
            </div>
        </div>

        <!-- แท็บ 3: แอดมิน (ตรวจสอบรูปภาพ & การส่งงานทั้งหมด) -->
        <div id="content-admin" class="tab-content hidden space-y-4">
            <div id="admin-auth" class="space-y-2 text-center">
                <h2 class="font-bold pink-header">🔒 ยืนยันรหัสผ่านแอดมิน</h2>
                <input type="password" id="admin-pass" placeholder="8888" maxlength="4" class="p-2 border border-pink-200 rounded-lg text-center font-bold w-full">
                <button onclick="loginAdmin()" class="w-full pink-btn py-2 rounded-lg font-bold text-sm">เข้าสู่ระบบแอดมิน</button>
            </div>

            <div id="admin-main" class="hidden space-y-4">
                <!-- ตารางรายการส่งงานของนักเรียน -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <h2 class="font-bold pink-header text-sm">📊 ตรวจสอบงานที่นักเรียนส่งมา</h2>
                        <button onclick="loadAdmin()" class="text-xs bg-rose-100 text-rose-700 px-2 py-1 rounded">🔄 รีเฟรช</button>
                    </div>
                    
                    <div class="overflow-x-auto text-xs">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-pink-100 text-rose-800">
                                    <th class="p-1.5 border">วันที่</th>
                                    <th class="p-1.5 border">ชื่อนักเรียน</th>
                                    <th class="p-1.5 border">สถานที่</th>
                                    <th class="p-1.5 border text-center">รูปถ่าย</th>
                                    <th class="p-1.5 border text-center">สถานะ</th>
                                    <th class="p-1.5 border text-center">คะแนน</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table"></tbody>
                        </table>
                    </div>
                </div>

                <hr class="border-pink-200">

                <!-- ระบบเพิ่ม / ลบ รายชื่อครู -->
                <div class="bg-pink-50 p-3 rounded-xl border border-pink-200 space-y-2">
                    <h3 class="font-bold pink-header text-xs">👩‍🏫 จัดการรายชื่อคุณครู</h3>
                    <div class="flex gap-2">
                        <input type="text" id="add-tc-name" placeholder="ชื่อคุณครูท่านใหม่" class="p-2 border border-pink-200 rounded-lg text-xs flex-1">
                        <button onclick="addTeacher()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-3 py-1.5 rounded-lg text-xs">เพิ่มครู</button>
                    </div>
                    
                    <div class="pt-2">
                        <ul id="admin-tc-list" class="space-y-1 text-xs">
                            <li class="text-gray-400">กำลังโหลด...</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div id="status" class="mt-3 text-center text-xs font-semibold p-2 rounded hidden"></div>
    </div>

    <script>
        const SCRIPT_URL = "ใส่_WEB_APP_URL_ของคุณที่นี่";
        let jobs = [];

        document.getElementById('st-date').valueAsDate = new Date();

        function switchTab(t) {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(e => e.classList.remove('tab-active'));
            document.getElementById('content-' + t).classList.remove('hidden');
            document.getElementById('tab-' + t).classList.add('tab-active');

            if (t === 'teacher' && !document.getElementById('tc-main').classList.contains('hidden')) loadJobs();
            if (t === 'admin' && !document.getElementById('admin-main').classList.contains('hidden')) loadAdmin();
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const maxW = 600;
                        const scale = maxW / img.width;
                        canvas.width = maxW;
                        canvas.height = img.height * scale;
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        async function submitStudentWork(e) {
            e.preventDefault();
            showMsg("⏳ กำลังส่งข้อมูล...", "blue");
            const file = document.getElementById('st-image').files[0];
            let imgBase64 = file ? await compressImage(file) : "";

            const data = {
                action: "submitJob",
                date: document.getElementById('st-date').value,
                classVal: document.getElementById('st-class').value,
                sender: document.getElementById('st-sender').value,
                area: document.getElementById('st-area').value,
                image: imgBase64
            };

            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            showMsg("✅ ส่งงานเรียบร้อยแล้ว (สถานะ: รอการตรวจ)", "green");
            e.target.reset();
        }

        function toggleTcAuth() {
            const loginForm = document.getElementById('tc-login-form');
            const regForm = document.getElementById('tc-reg-form');
            const title = document.getElementById('tc-auth-title');
            const btn = document.getElementById('tc-toggle-btn');

            if (loginForm.classList.contains('hidden')) {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                title.innerText = "🔐 เข้าสู่ระบบครู";
                btn.innerText = "ยังไม่มีบัญชี? สมัครสมาชิกครู";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                title.innerText = "📝 สมัครสมาชิกครูใหม่";
                btn.innerText = "มีบัญชีอยู่แล้ว? เข้าสู่ระบบ";
            }
        }

        async function registerTeacher(e) {
            e.preventDefault();
            const name = document.getElementById('tc-reg-name').value;
            showMsg("⏳ กำลังลงทะเบียน...", "blue");
            
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "addTeacher", name: name })
            });

            showMsg("✅ สมัครสมาชิกครูสำเร็จ! กรุณาเข้าสู่ระบบ", "green");
            document.getElementById('tc-reg-name').value = '';
            toggleTcAuth();
        }

        function loginTeacher(e) {
            e.preventDefault();
            const tcName = document.getElementById('tc-user').value;
            if (tcName) {
                document.getElementById('tc-auth').classList.add('hidden');
                document.getElementById('tc-main').classList.remove('hidden');
                document.getElementById('tc-welcome').innerText = `📋 รายการรอตรวจ (ครู: ${tcName})`;
                loadJobs();
            }
        }

        async function loadJobs() {
            const res = await fetch(SCRIPT_URL + "?action=getJobs");
            const data = await res.json();
            if (data.result === 'success') {
                jobs = data.data;
                const select = document.getElementById('job-select');
                select.innerHTML = '<option value="">-- เลือกลิสต์นักเรียนที่รอตรวจ --</option>';
                jobs.filter(j => j.status === 'รอตรวจ').forEach(j => {
                    select.innerHTML += `<option value="${j.id}">[${j.classVal}] ${j.sender} (${j.area})</option>`;
                });
            }
        }

        function showSelectedJob() {
            const id = document.getElementById('job-select').value;
            const job = jobs.find(j => j.id === id);
            document.getElementById('tc-img').src = job && job.imageUrl ? job.imageUrl : "https://via.placeholder.com/300x150?text=ไม่มีรูปภาพ";
        }

        async function submitGrade(e) {
            e.preventDefault();
            const id = document.getElementById('job-select').value;
            if (!id) return alert("เลือกงานก่อนครับ");
            
            showMsg("⏳ กำลังบันทึกคะแนน...", "blue");
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({
                    action: "gradeJob",
                    jobId: id,
                    score: document.getElementById('tc-score').value,
                    comment: document.getElementById('tc-comment').value
                })
            });
            showMsg("✅ ให้คะแนนสำเร็จ! งานเปลี่ยนเป็นตรวจแล้ว", "green");
            document.getElementById('tc-score').value = '';
            document.getElementById('tc-comment').value = '';
            loadJobs();
        }

        function loginAdmin() {
            if (document.getElementById('admin-pass').value === '8888') {
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('admin-main').classList.remove('hidden');
                loadAdmin();
            } else {
                alert('รหัสผ่านไม่ถูกต้อง');
            }
        }

        async function loadAdmin() {
            const res = await fetch(SCRIPT_URL + "?action=getJobs");
            const data = await res.json();
            if (data.result === 'success') {
                const tbody = document.getElementById('admin-table');
                tbody.innerHTML = '';
                data.data.forEach(j => {
                    const imgLink = j.imageUrl ? `<a href="${j.imageUrl}" target="_blank" class="bg-rose-500 text-white px-2 py-0.5 rounded text-[10px] hover:bg-rose-600 font-bold">🖼️ เปิดดูรูป</a>` : '<span class="text-gray-400">ไม่มีรูป</span>';
                    const statusBg = j.status === 'ตรวจแล้ว' ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700';
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-pink-50">
                            <td class="p-1.5 border">${j.date}</td>
                            <td class="p-1.5 border font-semibold">${j.sender} <br><span class="text-[10px] text-gray-500">(${j.classVal})</span></td>
                            <td class="p-1.5 border">${j.area}</td>
                            <td class="p-1.5 border text-center">${imgLink}</td>
                            <td class="p-1.5 border text-center"><span class="px-1.5 py-0.5 rounded text-[10px] ${statusBg}">${j.status}</span></td>
                            <td class="p-1.5 border font-bold text-rose-600 text-center">${j.score}</td>
                        </tr>
                    `;
                });
            }
            loadTeachersList();
        }

        async function loadTeachersList() {
            const res = await fetch(SCRIPT_URL + "?action=getTeachers");
            const data = await res.json();
            const ul = document.getElementById('admin-tc-list');
            ul.innerHTML = '';
            if (data.result === 'success' && data.data.length > 0) {
                data.data.forEach(tc => {
                    ul.innerHTML += `
                        <li class="flex justify-between items-center bg-white p-1.5 rounded border">
                            <span>👩‍🏫 ${tc.name}</span>
                            <button onclick="deleteTeacher('${tc.name}')" class="text-red-500 hover:underline font-bold text-[10px]">ลบ</button>
                        </li>
                    `;
                });
            } else {
                ul.innerHTML = '<li class="text-gray-400">ยังไม่มีรายชื่อครูในระบบ</li>';
            }
        }

        async function addTeacher() {
            const name = document.getElementById('add-tc-name').value;
            if (!name) return alert("กรุณากรอกชื่อครู");
            showMsg("⏳ กำลังเพิ่มรายชื่อครู...", "blue");
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "addTeacher", name: name })
            });
            document.getElementById('add-tc-name').value = '';
            showMsg("✅ เพิ่มรายชื่อครูเรียบร้อย", "green");
            loadTeachersList();
        }

        async function deleteTeacher(name) {
            if (confirm(`คุณต้องการลบรายชื่อ "${name}" ใช่หรือไม่?`)) {
                showMsg("⏳ กำลังลบรายชื่อครู...", "blue");
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "deleteTeacher", name: name })
                });
                showMsg("✅ ลบรายชื่อครูเรียบร้อยแล้ว", "green");
                loadTeachersList();
            }
        }

        function showMsg(m, c) {
            const el = document.getElementById('status');
            el.className = `mt-3 text-center text-xs font-semibold p-2 rounded bg-${c}-100 text-${c}-700`;
            el.innerText = m;
            el.classList.remove('hidden');
        }
    </script>
</body>
</html>
