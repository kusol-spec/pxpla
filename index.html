<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจและให้คะแนน</title>
    <!-- เรียกใช้ Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow-lg">
        <h2 class="text-2xl font-bold text-center text-blue-600 mb-6">ฟอร์มบันทึกการตรวจและให้คะแนน</h2>

        <form id="checkForm" class="space-y-4">
            <!-- วันที่ -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">วันที่ตรวจ</label>
                <input type="date" id="inspectionDate" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- รายชื่อผู้ส่ง / นักเรียน -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">ชื่อผู้ส่ง / นักเรียน</label>
                <input type="text" id="sender" placeholder="ระบุชื่อผู้ส่ง" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- พื้นที่ / จุดตรวจ -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">พื้นที่ / บริเวณที่ตรวจ</label>
                <input type="text" id="area" placeholder="เช่น ห้องเรียน 101, หน้าอาคาร 1" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- ชั้น / ห้อง -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">ชั้น / ห้อง</label>
                <input type="text" id="classVal" placeholder="เช่น ม.3/1" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- ครูผู้ตรวจ -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">ครูผู้ตรวจ</label>
                <input type="text" id="checker" placeholder="ระบุชื่อครูผู้ตรวจ" required class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <!-- ให้คะแนน (ส่วนที่เพิ่มใหม่) -->
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
                <label class="block text-blue-900 font-bold mb-1">คะแนนที่ให้ (0 - 10 คะแนน)</label>
                <input type="number" id="score" min="0" max="10" value="10" required class="w-full p-2 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-lg font-bold text-center text-blue-700">
            </div>

            <!-- หมายเหตุ / ข้อเสนอแนะ -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">ข้อคิดเห็น / คำแนะนำจากครู</label>
                <textarea id="comment" rows="2" placeholder="ใส่ข้อความแนบท้ายการตรวจ (ถ้ามี)" class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-400 outline-none"></textarea>
            </div>

            <!-- อัปโหลดรูปภาพ -->
            <div>
                <label class="block text-gray-700 font-semibold mb-1">แนบรูปภาพผลการตรวจ</label>
                <input type="file" id="imageFile" accept="image/*" class="w-full p-1 border rounded-lg text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-100 file:text-blue-700 hover:file:bg-blue-200">
            </div>

            <!-- ปุ่มบันทึก -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200 shadow-md">
                บันทึกการตรวจและคะแนน
            </button>
        </form>

        <div id="statusMessage" class="mt-4 text-center font-semibold"></div>
    </div>

    <script>
        // ⚠️ วาง URL ที่ได้จากการ Deploy Google Apps Script ของคุณที่นี่ ⚠️
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY4vdnTjB9hHFvrc28Rry6NfvLBJex22pR-Ir7psRSZFHhT-22PuSkMMH4YHQVf_4F/exec";

        // ตั้งค่าวันที่เริ่มต้นเป็นปัจจุบัน
        document.getElementById('inspectionDate').valueAsDate = new Date();

        // ฟังก์ชันแปลงรูปภาพเป็น Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) resolve("");
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // จัดการการส่งฟอร์ม
        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.innerText = "กำลังบันทึกข้อมูล...";
            statusMsg.innerText = "";
            statusMsg.className = "mt-4 text-center font-semibold text-blue-600";

            try {
                const fileInput = document.getElementById('imageFile').files[0];
                let imageBase64 = "";
                if (fileInput) {
                    imageBase64 = await fileToBase64(fileInput);
                }

                // เตรียมข้อมูลส่งไปยัง Google Apps Script
                const payload = {
                    date: document.getElementById('inspectionDate').value,
                    sender: document.getElementById('sender').value,
                    area: document.getElementById('area').value,
                    class: document.getElementById('classVal').value,
                    checker: document.getElementById('checker').value,
                    score: document.getElementById('score').value,
                    comment: document.getElementById('comment').value,
                    status: "ตรวจแล้ว",
                    image: imageBase64
                };

                // ส่งข้อมูล
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.result === 'success') {
                    statusMsg.innerText = "✅ บันทึกข้อมูลและให้คะแนนเรียบร้อยแล้ว!";
                    statusMsg.className = "mt-4 text-center font-semibold text-green-600";
                    document.getElementById('checkForm').reset();
                    document.getElementById('inspectionDate').valueAsDate = new Date();
                } else {
                    throw new Error(result.message || "เกิดข้อผิดพลาดในการบันทึก");
                }
            } catch (err) {
                statusMsg.innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
                statusMsg.className = "mt-4 text-center font-semibold text-red-600";
            } finally {
                btn.disabled = false;
                btn.innerText = "บันทึกการตรวจและคะแนน";
            }
        });
    </script>
</body>
</html>
