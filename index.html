<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานการทำเวร</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .btn-absent { background-color: #fecdd3; color: #be123c; border: 1px solid #fda4af; }
        .btn-absent.selected { background-color: #e11d48; color: white; }
    </style>
</head>
<body class="bg-gray-100 p-4 max-w-lg mx-auto text-gray-800">

    <div class="bg-white p-5 rounded-xl shadow mb-6 space-y-4">
        <h2 class="text-lg font-bold text-rose-600 border-b pb-2">📋 รายงานการทำเวร</h2>

        <!-- 1. เลือกจุดทำเวร -->
        <div>
            <label class="block text-sm font-semibold mb-1">จุดทำเวร:</label>
            <select id="locationSelect" onchange="loadStudents()" class="w-full p-2 border rounded-lg">
                <option value="">-- กำลังโหลดข้อมูล... --</option>
            </select>
        </div>

        <!-- 2. ชื่อผู้ส่ง -->
        <div>
            <label class="block text-sm font-semibold mb-1">ชื่อผู้ส่งรายงาน:</label>
            <input type="text" id="studentName" placeholder="กรอกชื่อ-นามสกุล" class="w-full p-2 border rounded-lg">
        </div>

        <!-- 3. สถานะ -->
        <div>
            <label class="block text-sm font-semibold mb-1">การมาทำเวร:</label>
            <div class="flex gap-4">
                <label><input type="radio" name="status" value="มาทำครบทุกคน" checked onclick="toggleAbsent(false)"> มาครบ</label>
                <label><input type="radio" name="status" value="มาทำไม่ครบ" onclick="toggleAbsent(true)"> มาไม่ครบ</label>
            </div>
        </div>

        <!-- 4. ปุ่มเลือกรายชื่อคนที่ไม่มา -->
        <div id="absentBox" class="hidden p-3 bg-rose-50 border border-rose-200 rounded-lg space-y-2">
            <label class="block text-xs font-bold text-rose-700">คลิกเลือกชื่อคนที่ไม่มาทำเวร:</label>
            <div id="studentList" class="flex flex-wrap gap-2">
                <span class="text-xs text-gray-400">กรุณาเลือกจุดทำเวรก่อน</span>
            </div>
            <div class="text-xs text-rose-800 pt-1 font-semibold">
                คนที่ขาด: <span id="absentText">-</span>
            </div>
        </div>

        <button onclick="submitData()" class="w-full bg-rose-500 text-white py-2.5 rounded-lg font-bold hover:bg-rose-600">ส่งรายงาน</button>
    </div>

    <!-- ส่วนของคุณครู: สุ่มเวร -->
    <div class="bg-white p-5 rounded-xl shadow space-y-3">
        <h2 class="text-lg font-bold text-purple-600 border-b pb-2">🎲 สุ่มรายชื่อทำเวร (สำหรับครู)</h2>
        <button onclick="randomDuty()" class="w-full bg-purple-500 text-white py-2 rounded-lg font-bold hover:bg-purple-600">กดสุ่มทำเวร</button>
        <div id="randomResult" class="text-sm space-y-1"></div>
    </div>

    <script>
        // *** วาง Web App URL จาก Apps Script ในเครื่องหมายคำพูดด้านล่างนี้ ***
        const API_URL = "https://script.google.com/macros/s/AKfycby8ZPwze2gytfcDdO1JYEOZD75-90_oovqinETbDU-9FTg7SDO10JBb6NpDM_XUwuE/exec";

        let allLocations = [];
        let absentList = [];

        // โหลดจุดทำเวรตอนเปิดหน้าเว็บ
        window.onload = async () => {
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getInitialData' }) }).then(r => r.json());
            if (res.locations) {
                allLocations = res.locations;
                const select = document.getElementById('locationSelect');
                select.innerHTML = '<option value="">-- เลือกจุดทำเวร --</option>';
                res.locations.forEach(loc => select.innerHTML += `<option value="${loc}">${loc}</option>`);
            }
        };

        // เมื่อเลือกจุด ให้ดึงรายชื่อคนในจุดนั้นมาทำปุ่ม
        async function loadStudents() {
            const loc = document.getElementById('locationSelect').value;
            if (!loc) return;

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getStudentsByLocation', location: loc }) }).then(r => r.json());
            const container = document.getElementById('studentList');
            absentList = [];
            document.getElementById('absentText').innerText = '-';

            if (!res.students || res.students.length === 0) {
                container.innerHTML = '<span class="text-xs text-gray-400">ไม่มีรายชื่อนักเรียนในจุดนี้</span>';
                return;
            }

            container.innerHTML = res.students.map(name => `
                <button type="button" onclick="selectAbsent('${name}', this)" class="btn-absent px-3 py-1 text-xs rounded-lg font-medium">
                    + ${name}
                </button>
            `).join('');
        }

        // กดเลือก/ยกเลิก รายชื่อคนที่ไม่มา
        function selectAbsent(name, btn) {
            const idx = absentList.indexOf(name);
            if (idx === -1) {
                absentList.push(name);
                btn.classList.add('selected');
                btn.innerText = `✓ ${name}`;
            } else {
                absentList.splice(idx, 1);
                btn.classList.remove('selected');
                btn.innerText = `+ ${name}`;
            }
            document.getElementById('absentText').innerText = absentList.length > 0 ? absentList.join(', ') : '-';
        }

        function toggleAbsent(show) {
            document.getElementById('absentBox').classList.toggle('hidden', !show);
        }

        // ส่งรายงาน
        async function submitData() {
            const name = document.getElementById('studentName').value;
            const loc = document.getElementById('locationSelect').value;
            const status = document.querySelector('input[name="status"]:checked').value;

            if (!name || !loc) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

            const payload = {
                action: 'submitReport',
                studentName: name,
                location: loc,
                status: status,
                absentDetails: absentList.join(', ')
            };

            await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            alert('ส่งรายงานเรียบร้อยแล้ว');
            location.reload();
        }

        // สุ่มรายชื่อทำเวร
        async function randomDuty() {
            if (allLocations.length === 0) return alert('ยังไม่มีข้อมูลจุดทำเวร');
            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'randomDuty', locations: allLocations }) }).then(r => r.json());
            
            const resultDiv = document.getElementById('randomResult');
            resultDiv.innerHTML = '';
            for (let loc in res.result) {
                resultDiv.innerHTML += `<div class="p-2 bg-purple-50 rounded border"><b>📍 ${loc}:</b> ${res.result[loc].join(', ') || 'ไม่มีรายชื่อ'}</div>`;
            }
        }
    </script>
</body>
</html>
