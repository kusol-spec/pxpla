<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการตรวจและให้คะแนน</title>
    <!-- เรียกใช้ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เรียกใช้ฟอนต์ Sarabun -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #fff0f3 !important; /* พื้นหลังสีชมพูพาสเทล */
        }
        .pink-card {
            background-color: #ffffff;
            border: 2px solid #fecdd3;
            box-shadow: 0 10px 25px -5px rgba(244, 63, 94, 0.15);
        }
        .pink-header {
            color: #e11d48;
        }
        .pink-subtle {
            color: #fb7185;
        }
        .pink-label {
            color: #be123c;
            font-weight: 600;
        }
        .pink-input {
            border: 2px solid #fecdd3 !important;
        }
        .pink-input:focus {
            border-color: #f43f5e !important;
            outline: none;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
        }
        .pink-score-box {
            background-color: #ffe4e6 !important;
            border: 2px solid #fda4af !important;
        }
        .pink-btn {
            background-color: #f43f5e !important;
            color: #ffffff !important;
        }
        .pink-btn:hover {
            background-color: #e11d48 !important;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-xl w-full pink-card p-6 md:p-8 rounded-3xl">
        
        <!-- หัวข้อหน้าเว็บ -->
        <div class="text-center mb-6 pb-4 border-b-2 border-dashed border-pink-200">
            <div class="text-4xl mb-2">🌸</div>
            <h1 class="text-2xl md:text-3xl font-bold pink-header">ระบบบันทึกการตรวจ</h1>
            <h2 class="text-lg font-semibold pink-subtle mt-1">และให้คะแนนความสะอาด</h2>
        </div>

        <form id="checkForm" class="space-y-4">
            
            <!-- วันที่ตรวจ -->
            <div>
                <label class="block pink-label mb-1">📅 วันที่ตรวจ</label>
                <input type="date" id="inspectionDate" required class="w-full p-2.5 rounded-xl pink-input">
            </div>

            <!-- ชื่อผู้ส่ง / นักเรียน -->
            <div>
                <label class="block pink-label mb-1">👤 ชื่อผู้ส่ง / นักเรียน</label>
                <input type="text" id="sender" placeholder="ระบุชื่อผู้ส่ง" required class="w-full p-2.5 rounded-xl pink-input">
            </div>

            <!-- พื้นที่ / จุดตรวจ -->
            <div>
                <label class="block pink-label mb-1">📍 พื้นที่ / บริเวณที่ตรวจ</label>
                <input type="text" id="area" placeholder="เช่น ห้องเรียน 101, หน้าอาคาร 1" required class="w-full p-2.5 rounded-xl pink-input">
            </div>

            <!-- ชั้น / ห้อง -->
            <div>
                <label class="block pink-label mb-1">🏫 ชั้น / ห้อง</label>
                <input type="text" id="classVal" placeholder="เช่น ม.3/1" class="w-full p-2.5 rounded-xl pink-input">
            </div>

            <!-- ครูผู้ตรวจ -->
            <div>
                <label class="block pink-label mb-1">👩‍🏫 ครูผู้ตรวจ</label>
                <input type="text" id="checker" placeholder="ระบุชื่อครูผู้ตรวจ" required class="w-full p-2.5 rounded-xl pink-input">
            </div>

            <!-- กล่องให้คะแนน (สีชมพูเด่น) -->
            <div class="pink-score-box p-4 rounded-2xl text-center my-2">
                <label class="block pink-header font-bold mb-1 text-lg">💯 คะแนนที่ให้ (0 - 10 คะแนน)</label>
                <input type="number" id="score" min="0" max="10" value="10" required 
                    class="w-full p-3 rounded-xl border-2 border-pink-300 text-3xl font-bold text-center text-rose-600 bg-white focus:outline-none">
            </div>

            <!-- ข้อคิดเห็น -->
            <div>
                <label class="block pink-label mb-1">📝 ข้อคิดเห็น / คำแนะนำจากครู</label>
                <textarea id="comment" rows="2" placeholder="ใส่ข้อความแนบท้ายการตรวจ (ถ้ามี)" class="w-full p-2.5 rounded-xl pink-input"></textarea>
            </div>

            <!-- แนบรูปภาพ -->
            <div>
                <label class="block pink-label mb-1">📸 แนบรูปภาพผลการตรวจ</label>
                <input type="file" id="imageFile" accept="image/*" class="w-full p-2 bg-pink-50 rounded-xl border border-pink-200 text-sm text-gray-600 file:mr-4 file:py-1.5 file:px-4 file:rounded-lg file:border-0 file:bg-rose-500 file:text-white hover:file:bg-rose-600">
            </div>

            <!-- ปุ่มบันทึกข้อมูล -->
            <div class="pt-2">
                <button type="submit" id="submitBtn" class="w-full pink-btn font-bold py-3.5 px-4 rounded-2xl text-lg shadow-md transition duration-200">
                    💖 บันทึกการตรวจและคะแนน
                </button>
            </div>

        </form>

        <div id="statusMessage" class="mt-4 text-center font-semibold hidden p-3 rounded-xl"></div>
    </div>

    <script>
        // ⚠️ อย่าลืมใส่ Web App URL ของ Google Apps Script ตรงนี้ครับ ⚠️
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY4vdnTjB9hHFvrc28Rry6NfvLBJex22pR-Ir7psRSZFHhT-22PuSkMMH4YHQVf_4F/exec";

        document.getElementById('inspectionDate').valueAsDate = new Date();

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) resolve("");
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            statusMsg.classList.remove('hidden', 'bg-red-100', 'text-red-600', 'bg-green-100', 'text-green-600');
            statusMsg.classList.add('bg-rose-100', 'text-rose-700');
            statusMsg.innerText = "⏳ กำลังบันทึกข้อมูล...";
            
            btn.disabled = true;
            btn.innerText = "กำลังบันทึก...";

            try {
                const fileInput = document.getElementById('imageFile').files[0];
                let imageBase64 = "";
                if (fileInput) {
                    imageBase64 = await fileToBase64(fileInput);
                }

                const payload = {
                    date: document.getElementById('inspectionDate').value,
                    sender: document.getElementById('sender').value,
                    area: document.getElementById('area').value,
                    class: document.getElementById('classVal').value,
                    checker: document.getElementById('checker').value,
                    score: document.getElementById('score').value,
                    comment: document.getElementById('comment').value,
                    status: "ตรวจแล้ว",
                    image: imageBase64
                };

                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.result === 'success') {
                    statusMsg.classList.remove('bg-rose-100', 'text-rose-700');
                    statusMsg.classList.add('bg-green-100', 'text-green-700');
                    statusMsg.innerText = "🌸 บันทึกข้อมูลและให้คะแนนเรียบร้อยแล้ว!";
                    document.getElementById('checkForm').reset();
                    document.getElementById('inspectionDate').valueAsDate = new Date();
                } else {
                    throw new Error(result.message || "เกิดข้อผิดพลาด");
                }
            } catch (err) {
                statusMsg.classList.remove('bg-rose-100', 'text-rose-700');
                statusMsg.classList.add('bg-red-100', 'text-red-600');
                statusMsg.innerText = "❌ เกิดข้อผิดพลาด: " + err.message;
            } finally {
                btn.disabled = false;
                btn.innerText = "💖 บันทึกการตรวจและคะแนน";
            }
        });
    </script>
</body>
</html>
