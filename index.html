<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจเวรประจำจุดนักเรียน (School Duty Inspection System)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        prompt: ['Prompt', 'sans-serif'],
                        kanit: ['Kanit', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            cream: '#FDFBF7',
                            lavender: '#E8E0FF',
                            blossom: '#FFD6E8',
                            mint: '#D8F3DC',
                            aqua: '#D0F4DE',
                            amber: '#FFECB3',
                            coral: '#FFD7C2',
                            pinkCream: '#FFE5E5',
                            purpleDark: '#6C5CE7',
                            mintDark: '#2ED573',
                            coralDark: '#FF7675',
                            amberDark: '#FFA502'
                        }
                    },
                    boxShadow: {
                        'soft': '0 10px 30px -5px rgba(180, 160, 220, 0.15)',
                        'card': '0 8px 20px rgba(0, 0, 0, 0.04)',
                        'floating': '0 20px 40px -10px rgba(108, 92, 231, 0.2)'
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Prompt', 'Kanit', sans-serif;
            background: linear-gradient(135deg, #FFFDF9 0%, #F5F0FF 50%, #EBF4FF 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #E2E8F0;
            transition: all 0.25s ease;
        }
        .glass-input:focus {
            border-color: #9333EA;
            box-shadow: 0 0 0 4px rgba(147, 51, 234, 0.12);
            outline: none;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F1F5F9;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #CBD5E1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94A3B8;
        }
    </style>
</head>
<body class="text-slate-700 antialiased selection:bg-purple-200 selection:text-purple-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Default Initial Data
        const INITIAL_LOCATIONS = [
            'โรงอาหาร',
            'ถนนหน้าโรงเรียน',
            'ถนนลานจอดรถ',
            'โดม',
            'ศาลาหลวงปู่',
            'สนามฟุตซอล',
            'ใต้ตึก',
            'สนามวอลเล่ย์',
            'ตึกกล่องนม'
        ];

        const INITIAL_TEACHERS = [
            { id: 't1', name: 'ครูสมชาย ใจดี', subject: 'สังคมศึกษา', username: 'somchai', password: '123' },
            { id: 't2', name: 'ครูวิภา รักเรียน', subject: 'วิทยาศาสตร์', username: 'wipa', password: '123' },
            { id: 't3', name: 'ครูณัฐพล ศรีสุข', subject: 'สุขศึกษาและพลศึกษา', username: 'nattapol', password: '123' }
        ];

        const DEFAULT_IMAGE_PLACEHOLDER = 'https://placehold.co/800x600/f1f5f9/94a3b8?text=%E0%B8%81%E0%B8%A3%E0%B8%B8%E0%B8%93%E0%B8%B2%E0%B8%AD%E0%B8%B1%E0%B8%9B%E0%B9%82%E0%B8%AB%E0%B8%A5%E0%B8%94%E0%B8%A3%E0%B8%B9%E0%B8%9B%E0%B8%96%E0%B9%88%E0%B8%B2%E0%B8%A2%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%9 me';

        const INITIAL_REPORTS = [
            {
                id: 'rep-101',
                studentName: 'นายกิตติศักดิ์ พัฒนา',
                classGrade: 'ม.5/1',
                studentNo: '12',
                location: 'โรงอาหาร',
                status: 'มาทำครบ',
                absentMembersReason: '',
                photoUrl: 'https://images.unsplash.com/photo-1577896851231-70ef18881754?auto=format&fit=crop&w=800&q=80',
                timestamp: '2026-09-30 07:30',
                inspectionStatus: 'ตรวจแล้ว',
                score: 10,
                teacherComment: 'กวาดพื้นและเช็ดโต๊ะสะอาดเรียบร้อยมาก ขอชมเชยกลุ่มนี้ครับ!',
                inspectedBy: 'ครูสมชาย ใจดี',
                inspectedAt: '2026-09-30 07:45'
            },
            {
                id: 'rep-102',
                studentName: 'นางสาวปรียาพร สุขเกษม',
                classGrade: 'ม.3/2',
                studentNo: '24',
                location: 'ถนนหน้าโรงเรียน',
                status: 'มาทำไม่ครบ',
                absentMembersReason: 'ด.ช.อนันต์ ป่วยลาป่วยกะทันหัน / ด.ญ.สุดา ติดภารกิจซ้อมรำโรงเรียน',
                photoUrl: 'https://images.unsplash.com/photo-1509062522246-3755977927d7?auto=format&fit=crop&w=800&q=80',
                timestamp: '2026-09-30 07:35',
                inspectionStatus: 'ตรวจแล้ว',
                score: 8,
                teacherComment: 'รับทราบสาเหตุเพื่อนที่ไม่มาครับ เก็บใบไม้แห้งริมถนนได้ดี แต่อยากให้จัดระเบียบถังขยะเพิ่มอีกนิดครับ',
                inspectedBy: 'ครูวิภา รักเรียน',
                inspectedAt: '2026-09-30 08:00'
            }
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('student'); // 'student', 'teacher', 'admin'
            
            // Persistent Data States
            const [locations, setLocations] = useState(() => {
                const saved = localStorage.getItem('duty_locations');
                return saved ? JSON.parse(saved) : INITIAL_LOCATIONS;
            });
            
            const [teachers, setTeachers] = useState(() => {
                const saved = localStorage.getItem('duty_teachers');
                return saved ? JSON.parse(saved) : INITIAL_TEACHERS;
            });

            const [reports, setReports] = useState(() => {
                const saved = localStorage.getItem('duty_reports');
                return saved ? JSON.parse(saved) : INITIAL_REPORTS;
            });

            // Auth States
            const [currentTeacher, setCurrentTeacher] = useState(() => {
                const saved = localStorage.getItem('duty_current_teacher');
                return saved ? JSON.parse(saved) : null;
            });
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);

            // Global Notification Toast
            const [toast, setToast] = useState(null);

            // Lightbox Modal Image View
            const [activeImageModal, setActiveImageModal] = useState(null);

            // Sync to LocalStorage
            useEffect(() => {
                localStorage.setItem('duty_locations', JSON.stringify(locations));
            }, [locations]);

            useEffect(() => {
                localStorage.setItem('duty_teachers', JSON.stringify(teachers));
            }, [teachers]);

            useEffect(() => {
                localStorage.setItem('duty_reports', JSON.stringify(reports));
            }, [reports]);

            useEffect(() => {
                if (currentTeacher) {
                    localStorage.setItem('duty_current_teacher', JSON.stringify(currentTeacher));
                } else {
                    localStorage.removeItem('duty_current_teacher');
                }
            }, [currentTeacher]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            const triggerConfetti = () => {
                if (window.confetti) {
                    window.confetti({
                        particleCount: 70,
                        spread: 60,
                        origin: { y: 0.7 }
                    });
                }
            };

            return (
                <div className="min-h-screen flex flex-col pb-12">
                    {/* Header Banner */}
                    <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-purple-100 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-20">
                                {/* Logo & Title */}
                                <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('student')}>
                                    <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-purple-500 via-pink-400 to-amber-300 flex items-center justify-center text-white shadow-md shadow-purple-200 transform hover:rotate-6 transition-transform">
                                        <i className="fa-solid fa-broom text-xl"></i>
                                    </div>
                                    <div>
                                        <h1 className="text-xl sm:text-2xl font-bold bg-gradient-to-r from-purple-700 via-pink-600 to-amber-600 bg-clip-text text-transparent font-kanit">
                                            ตรวจเวรประจำจุด
                                        </h1>
                                        <p className="text-xs text-slate-400 font-medium tracking-wide hidden sm:block">
                                            School Duty Inspection System
                                        </p>
                                    </div>
                                </div>

                                {/* Tab Navigation Buttons */}
                                <nav className="flex space-x-1 sm:space-x-2 bg-slate-100/80 p-1.5 rounded-2xl border border-slate-200/60">
                                    <button
                                        onClick={() => setActiveTab('student')}
                                        className={`flex items-center space-x-2 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
                                            activeTab === 'student'
                                                ? 'bg-white text-purple-700 shadow-sm font-semibold'
                                                : 'text-slate-600 hover:text-purple-600 hover:bg-white/50'
                                        }`}
                                    >
                                        <i className="fa-solid fa-graduation-cap text-purple-500"></i>
                                        <span>นักเรียน</span>
                                    </button>

                                    <button
                                        onClick={() => setActiveTab('teacher')}
                                        className={`flex items-center space-x-2 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
                                            activeTab === 'teacher'
                                                ? 'bg-white text-purple-700 shadow-sm font-semibold'
                                                : 'text-slate-600 hover:text-purple-600 hover:bg-white/50'
                                        }`}
                                    >
                                        <i className="fa-solid fa-chalkboard-user text-pink-500"></i>
                                        <span>ครูประจำการ</span>
                                        {currentTeacher && (
                                            <span className="w-2 h-2 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
                                        )}
                                    </button>

                                    <button
                                        onClick={() => setActiveTab('admin')}
                                        className={`flex items-center space-x-2 px-3 sm:px-4 py-2 rounded-xl text-xs sm:text-sm font-medium transition-all ${
                                            activeTab === 'admin'
                                                ? 'bg-white text-purple-700 shadow-sm font-semibold'
                                                : 'text-slate-600 hover:text-purple-600 hover:bg-white/50'
                                        }`}
                                    >
                                        <i className="fa-solid fa-user-gear text-amber-500"></i>
                                        <span>แอดมิน</span>
                                        {!isAdminLoggedIn && (
                                            <i className="fa-solid fa-lock text-[10px] text-slate-400"></i>
                                        )}
                                    </button>
                                </nav>
                            </div>
                        </div>
                    </header>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 animate-bounce">
                            <div className={`flex items-center space-x-3 px-5 py-3.5 rounded-2xl shadow-floating text-sm font-medium text-white ${
                                toast.type === 'error' ? 'bg-rose-500' : 'bg-emerald-600'
                            }`}>
                                <i className={`fa-solid ${toast.type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check'} text-lg`}></i>
                                <span>{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {/* Image Lightbox Modal */}
                    {activeImageModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm animate-fade-in" onClick={() => setActiveImageModal(null)}>
                            <div className="relative max-w-3xl w-full bg-white rounded-3xl p-3 shadow-2xl overflow-hidden" onClick={e => e.stopPropagation()}>
                                <button 
                                    onClick={() => setActiveImageModal(null)}
                                    className="absolute top-4 right-4 z-10 w-10 h-10 bg-black/60 hover:bg-black text-white rounded-full flex items-center justify-center transition-colors"
                                >
                                    <i className="fa-solid fa-xmark text-lg"></i>
                                </button>
                                <img 
                                    src={activeImageModal} 
                                    alt="Duty Inspection View" 
                                    className="w-full h-[70vh] object-contain rounded-2xl bg-slate-900" 
                                />
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main className="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 pt-8">
                        {activeTab === 'student' && (
                            <StudentView 
                                locations={locations} 
                                reports={reports} 
                                setReports={setReports} 
                                showToast={showToast}
                                triggerConfetti={triggerConfetti}
                                setActiveImageModal={setActiveImageModal}
                            />
                        )}

                        {activeTab === 'teacher' && (
                            <TeacherView 
                                currentTeacher={currentTeacher} 
                                setCurrentTeacher={setCurrentTeacher}
                                teachers={teachers}
                                setTeachers={setTeachers}
                                reports={reports}
                                setReports={setReports}
                                showToast={showToast}
                                triggerConfetti={triggerConfetti}
                                setActiveImageModal={setActiveImageModal}
                            />
                        )}

                        {activeTab === 'admin' && (
                            <AdminView 
                                isAdminLoggedIn={isAdminLoggedIn} 
                                setIsAdminLoggedIn={setIsAdminLoggedIn}
                                locations={locations}
                                setLocations={setLocations}
                                teachers={teachers}
                                setTeachers={setTeachers}
                                reports={reports}
                                setReports={setReports}
                                showToast={showToast}
                            />
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="mt-12 text-center text-xs text-slate-400 py-6 border-t border-slate-200/60">
                        <p>© 2026 ระบบตรวจเวรประจำจุดนักเรียน (School Duty Inspection System)</p>
                        <p className="mt-1 text-purple-400">ออกแบบและพัฒนารายงานการปฏิบัติงานเพื่อสถานศึกษา</p>
                    </footer>
                </div>
            );
        }

        function StudentView({ locations, reports, setReports, showToast, triggerConfetti, setActiveImageModal }) {
            const [studentTab, setStudentTab] = useState('form'); // 'form' or 'history'
            
            // Form State
            const [formData, setFormData] = useState({
                studentName: '',
                location: locations[0] || '',
                status: 'มาทำครบ', // 'มาทำครบ' or 'มาทำไม่ครบ'
                absentMembersReason: '',
                photoUrl: ''
            });

            const [uploading, setUploading] = useState(false);

            // Handle Custom Image Upload (Base64 file)
            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    setUploading(true);
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setFormData(prev => ({ ...prev, photoUrl: reader.result }));
                        setUploading(false);
                        showToast('อัปโหลดรูปภาพสำเร็จแล้ว!');
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();

                if (!formData.studentName.trim()) {
                    showToast('กรุณากรอกชื่อ-นามสกุลให้ครบถ้วน', 'error');
                    return;
                }

                if (!formData.photoUrl) {
                    showToast('กรุณาอัปโหลดรูปถ่ายการทำเวร', 'error');
                    return;
                }

                if (formData.status === 'มาทำไม่ครบ' && !formData.absentMembersReason.trim()) {
                    showToast('กรุณากรอกรายชื่อเพื่อนที่ไม่มาทำเวรและสาเหตุ', 'error');
                    return;
                }

                const now = new Date();
                const formattedTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

                const newReport = {
                    id: 'rep-' + Date.now(),
                    ...formData,
                    timestamp: formattedTime,
                    inspectionStatus: 'รอการตรวจ',
                    score: null,
                    teacherComment: '',
                    inspectedBy: '',
                    inspectedAt: ''
                };

                setReports([newReport, ...reports]);
                triggerConfetti();
                showToast('ส่งรายงานการทำเวรเรียบร้อยแล้ว!');

                // Reset Form
                setFormData({
                    studentName: '',
                    location: locations[0] || '',
                    status: 'มาทำครบ',
                    absentMembersReason: '',
                    photoUrl: ''
                });

                // Switch to History view automatically
                setStudentTab('history');
            };

            return (
                <div className="space-y-6 animate-fade-in">
                    {/* Welcome Hero Card */}
                    <div className="relative overflow-hidden rounded-3xl bg-gradient-to-r from-purple-600 via-pink-500 to-rose-400 p-6 sm:p-8 text-white shadow-floating">
                        <div className="absolute top-0 right-0 -mt-10 -mr-10 w-48 h-48 bg-white/10 rounded-full blur-2xl"></div>
                        <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <span className="inline-block px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-xs font-semibold tracking-wide uppercase mb-2">
                                    ✨ ประจำวัน
                                </span>
                                <h2 className="text-2xl sm:text-3xl font-bold font-kanit">
                                    รายงานการทำเวรประจำจุด
                                </h2>
                                <p className="text-purple-100 text-sm mt-1 max-w-xl">
                                    ส่งภาพถ่ายการทำเวรเพื่อเช็กชื่อและประเมินความสะอาด ร่วมสร้างโรงเรียนที่สะอาดเรียบร้อยน่าอยู่!
                                </p>
                            </div>
                            {/* Toggle Sub-tabs */}
                            <div className="flex bg-black/20 p-1.5 rounded-2xl backdrop-blur-md self-start md:self-auto">
                                <button
                                    onClick={() => setStudentTab('form')}
                                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                                        studentTab === 'form' ? 'bg-white text-purple-700 shadow-md' : 'text-white/80 hover:text-white'
                                    }`}
                                >
                                    <i className="fa-solid fa-paper-plane mr-1.5"></i>
                                    ส่งรายงานเวร
                                </button>
                                <button
                                    onClick={() => setStudentTab('history')}
                                    className={`px-4 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all ${
                                        studentTab === 'history' ? 'bg-white text-purple-700 shadow-md' : 'text-white/80 hover:text-white'
                                    }`}
                                >
                                    <i className="fa-solid fa-clock-rotate-left mr-1.5"></i>
                                    ประวัติการส่ง ({reports.length})
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* Sub Tab 1: Submit Form */}
                    {studentTab === 'form' && (
                        <div className="glass-card rounded-3xl p-6 sm:p-8 shadow-card border border-white">
                            <form onSubmit={handleSubmit} className="space-y-6">
                                <div className="border-b border-purple-100 pb-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 font-kanit">
                                        <span className="w-8 h-8 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center text-sm">
                                            1
                                        </span>
                                        ข้อมูลผู้รายงาน
                                    </h3>
                                </div>

                                <div className="grid grid-cols-1 gap-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">
                                            ชื่อ - นามสกุล *
                                        </label>
                                        <input
                                            type="text"
                                            required
                                            placeholder="เช่น ด.ช.รักดี เรียนเก่ง"
                                            value={formData.studentName}
                                            onChange={e => setFormData({ ...formData, studentName: e.target.value })}
                                            className="w-full px-4 py-3 rounded-2xl glass-input text-sm"
                                        />
                                    </div>
                                </div>

                                {/* Section 2: Duty Location & Status */}
                                <div className="border-b border-purple-100 pb-4 pt-4">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center gap-2 font-kanit">
                                        <span className="w-8 h-8 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center text-sm">
                                            2
                                        </span>
                                        รายละเอียดการทำเวร
                                    </h3>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Location Select Dropdown */}
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-2">

                    )}

                    {/* Sub Tab 2: History */}
                    {studentTab === 'history' && (

                                                                <span>ตรวจแล้ว</span>

                                                                <i className="fa-solid fa-hourglass-half text-amber-600"></i>
                                                                <span>รอการตรวจ</span>
                                                            </span>

                                                <div className="mb-3">

                                                                <i className="fa-solid fa-circle-exclamation text-rose-500"></i>
                                                                มาทำไม่ครบ

                                                        </div>
                                                    )}

                                                <div className="relative rounded-2xl overflow-hidden h-40 mb-3 bg-slate-100 border border-slate-200 group">
                                                    <img src={item.photoUrl || DEFAULT_IMAGE_PLACEHOLDER} alt="Duty" className="w-full h-full object-cover" />

                                                        <button

                                                            className="absolute inset-0 bg-black/40 text-white opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity text-xs font-medium"

                                                            ขยายรูปภาพ
                                                        </button>

                                                </div>
                                            </div>

                                            {/* Reviewed Results Section */}
                                            {item.inspectionStatus === 'ตรวจแล้ว' ? (
                                                <div className="mt-2 pt-3 border-t border-purple-100 bg-purple-50/60 p-3.5 rounded-2xl space-y-2">
                                                    <div className="flex items-center justify-between">
                                                        <span className="text-xs font-bold text-purple-900 flex items-center gap-1">
                                                            <i className="fa-solid fa-user-check text-purple-600"></i>
                                                            {item.inspectedBy}
                                                        </span>
                                                        <div className="flex items-center space-x-1 bg-amber-400 text-slate-900 px-2.5 py-0.5 rounded-full text-xs font-extrabold shadow-sm">

                                                            <span>{item.score} / 10 คะแนน</span>
                                                        </div>
                                                    </div>
                                                    {item.teacherComment && (
                                                        <p className="text-xs text-slate-700 bg-white p-2.5 rounded-xl border border-purple-100 italic leading-relaxed">
                                                            "{item.teacherComment}"

                                                </div>
