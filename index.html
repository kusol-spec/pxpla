<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบตรวจความสะอาดโรงเรียน</title>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Kanit', Tahoma, Geneva, Verdana, sans-serif;
      transition: all 0.25s ease;
    }

    /* พื้นหลังสีสันสดใส */
    body {
      background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%) !important;
      min-height: 100vh;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #2d3436;
    }

    .app-container {
      width: 100%;
      max-width: 800px;
    }

    /* แถบเมนูนำทาง */
    .nav-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-bottom: 20px;
      background: #ffffff;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .nav-btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      font-size: 15px;
      background: #f1f2f6;
      color: #576574;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .nav-btn.active {
      background: #6c5ce7 !important;
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(108, 92, 231, 0.4);
    }

    /* กล่องการ์ดเนื้อหา */
    .card {
      background: #ffffff !important;
      width: 100%;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    /* กล่องหัวข้อสีฟ้าสดใส */
    .header-box {
      background: #74b9ff !important;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 25px;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(116, 185, 255, 0.4);
    }

    .header-title {
      margin: 0;
      font-size: 22px;
      font-weight: bold;
    }

    /* จัดวางฟอร์ม */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full-width { grid-column: span 2; }

    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .nav-bar { flex-direction: column; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
      color: #2d3436;
    }

    input[type="text"], input[type="password"], input[type="number"], select {
      width: 100%;
      height: 45px;
      padding: 8px 12px;
      font-size: 15px;
      border: 2px solid #dfe6e9;
      border-radius: 10px;
      background: #f8fafc;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #6c5ce7;
      background: #fff;
    }

    /* กล่องอัปโหลดไฟล์ */
    .file-upload-wrapper {
      border: 2px dashed #00cec9;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      background: #e6fffa;
      cursor: pointer;
      position: relative;
    }

    .file-upload-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }

    /* ปุ่มหลักสีเขียวสดใส */
    .btn-main {
      width: 100%;
      height: 50px;
      background: #00b894 !important;
      color: #ffffff !important;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 184, 148, 0.4);
    }

    .btn-main:hover {
      background: #00a884 !important;
    }

    .hidden { display: none !important; }

    /* แท็บสลับ เข้าสู่ระบบ/สมัครสมาชิก */
    .auth-tab {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      background: #f1f2f6;
      padding: 5px;
      border-radius: 10px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      background: transparent;
      color: #636e72;
    }

    .auth-tab-btn.active {
      background: #ffffff;
      color: #6c5ce7;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ตารางแอดมิน */
    .teacher-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .teacher-table th, .teacher-table td {
      padding: 10px;
      border: 1px solid #dfe6e9;
      text-align: left;
    }

    .teacher-table th { background: #f1f2f6; }

    .preview-img {
      max-height: 120px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- เมนูเปลี่ยนหน้า -->
    <div class="nav-bar">
      <button class="nav-btn active" onclick="switchPage('form')">
        <i class="fa-solid fa-broom"></i> ฟอร์มตรวจความสะอาด
      </button>
      <button class="nav-btn" onclick="switchPage('teacher')">
        <i class="fa-solid fa-chalkboard-user"></i> ระบบครูประเมิน
      </button>
      <button class="nav-btn" onclick="switchPage('admin')">
        <i class="fa-solid fa-user-shield"></i> ผู้ดูแลระบบ (Admin)
      </button>
    </div>

    <!-- 1. หน้าฟอร์มตรวจความสะอาด -->
    <div id="page-form" class="card">
      <div class="header-box">
        <h2 class="header-title"><i class="fa-solid fa-sparkles"></i> ฟอร์มบันทึกการตรวจความสะอาด</h2>
      </div>
      
      <form id="inspectionForm" class="form-grid">
        <div class="form-group">
          <label>ชื่อผู้ส่ง (Sender):</label>
          <input type="text" id="sender" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>

        <div class="form-group">
          <label>ระดับชั้น (Class):</label>
          <select id="classVal" required>
            <option value="">-- เลือกระดับชั้น --</option>
            <option value="ม.1">มัธยมศึกษาปีที่ 1</option>
            <option value="ม.2">มัธยมศึกษาปีที่ 2</option>
            <option value="ม.3">มัธยมศึกษาปีที่ 3</option>
            <option value="ม.4">มัธยมศึกษาปีที่ 4</option>
            <option value="ม.5">มัธยมศึกษาปีที่ 5</option>
            <option value="ม.6">มัธยมศึกษาปีที่ 6</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>สถานที่/บริเวณ (Area):</label>
          <select id="area" required>
            <option value="">-- เลือกสถานที่ตรวจ --</option>
            <option value="ตรวจห้องเรียน">ตรวจห้องเรียน</option>
            <option value="โรงอาหาร">โรงอาหาร</option>
            <option value="สนามบาส">สนามบาสเกตบอล</option>
            <option value="อาคารกล่องนม">อาคารกล่องนม</option>
            <option value="ใต้ตึก">ใต้ตึกเรียน</option>
            <option value="ทางเดินถนน">ทางเดินถนน</option>
            <option value="ทางเดินศาลาแดง">ทางเดินศาลาแดง</option>
            <option value="โดม">โดมกิจกรรม</option>
            <option value="สนามฟุตบอล">สนามฟุตบอล</option>
            <option value="บริเวณหลวงปู่">บริเวณองค์หลวงปู่</option>
          </select>
        </div>

        <div class="form-group full-width">
          <label>แนบรูปภาพการตรวจ:</label>
          <div class="file-upload-wrapper">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 28px; color: #00cec9;"></i>
            <p style="margin: 5px 0 0 0; font-size: 14px; color: #636e72;" id="file-label">กดเลือกรูปภาพแนบไฟล์</p>
            <input type="file" id="imageFile" accept="image/*" required onchange="handleFileSelect(event)">
          </div>
          <img id="img-preview" class="preview-img" alt="ตัวอย่างรูปภาพ">
        </div>

        <div class="full-width" style="margin-top: 10px;">
          <button type="button" class="btn-main" id="submitBtn" onclick="sendData()">
            <i class="fa-solid fa-paper-plane"></i> ส่งข้อมูลตรวจความสะอาด
          </button>
        </div>
      </form>
    </div>

    <!-- 2. หน้าระบบครู -->
    <div id="page-teacher" class="card hidden">
      <div class="header-box" style="background: #a29bfe !important;">
        <h2 class="header-title"><i class="fa-solid fa-clipboard-check"></i> ระบบครูตรวจประเมินคะแนน</h2>
      </div>
      
      <div id="teacher-auth" style="max-width: 350px; margin: 0 auto;">
        <div class="auth-tab">
          <button id="tab-login-btn" class="auth-tab-btn active" onclick="toggleTeacherAuth('login')">เข้าสู่ระบบ</button>
          <button id="tab-reg-btn" class="auth-tab-btn" onclick="toggleTeacherAuth('register')">สมัครสมาชิกครู</button>
        </div>

        <div id="form-teacher-login">
          <div class="form-group" style="margin-bottom: 10px;">
            <label>ชื่อผู้ใช้งานครู:</label>
            <input type="text" id="teacher-login-user" placeholder="กรอกชื่อเข้าใช้งาน">
          </div>
          <div class="form-group" style="margin-bottom: 15px;">
            <label>รหัสผ่าน:</label>
            <input type="password" id="teacher-login-pass" placeholder="กรอกรหัสผ่าน">
          </div>
          <button type="button" class="btn-main" style="background: #6c5ce7 !important;" onclick="loginTeacher()">
            เข้าสู่ระบบครู
          </button>
        </div>

        <div id="form-teacher-reg" class="hidden">
          <div class="form-group" style="margin-bottom: 10px;">
            <label>ตั้งชื่อผู้ใช้งานครู:</label>
            <input type="text" id="teacher-reg-user" placeholder="ตั้งชื่อผู้ใช้งาน">
          </div>
          <div class="form-group" style="margin-bottom: 15px;">
            <label>ตั้งรหัสผ่าน:</label>
            <input type="password" id="teacher-reg-pass" placeholder="ตั้งรหัสผ่าน">
          </div>
          <button type="button" class="btn-main" style="background: #e84393 !important;" onclick="registerTeacherInline()">
            ยืนยันสมัครสมาชิกครู
          </button>
        </div>
      </div>

      <div id="teacher-panel" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background:#f1f2f6; padding:10px 15px; border-radius:10px;">
          <span id="teacher-welcome" style="font-weight:bold;"></span>
          <button onclick="logout('teacher')" style="padding:6px 12px; background:#dfe6e9; border:none; border-radius:6px; cursor:pointer;">ออกจากระบบ</button>
        </div>
        <p style="text-align:center; color:#636e72;">เข้าสู่ระบบครูเรียบร้อยแล้ว</p>
      </div>
    </div>

    <!-- 3. หน้าระบบแอดมิน -->
    <div id="page-admin" class="card hidden">
      <div class="header-box" style="background: #ff7675 !important;">
        <h2 class="header-title"><i class="fa-solid fa-user-gear"></i> ระบบผู้ดูแลระบบ (Admin)</h2>
      </div>

      <div id="admin-auth" style="max-width: 350px; margin: 0 auto;">
        <div class="form-group" style="margin-bottom: 15px;">
          <label>กรอกรหัสผ่านผู้ดูแลระบบ:</label>
          <input type="password" id="admin-pass" placeholder="กรอกรหัสผ่าน (8888)">
        </div>
        <button type="button" class="btn-main" style="background: #d63031 !important;" onclick="loginAdmin()">
          เข้าสู่ระบบ Admin
        </button>
      </div>

      <div id="admin-panel" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; background:#ffeaa7; padding:10px 15px; border-radius:10px;">
          <span style="font-weight:bold; color:#d63031;">แผงควบคุมระบบแอดมิน</span>
          <button onclick="logout('admin')" style="padding:6px 12px; background:#dfe6e9; border:none; border-radius:6px; cursor:pointer;">ออกจากระบบ</button>
        </div>
        
        <div style="background:#f8fafc; padding:15px; border-radius:10px; border:1px solid #dfe6e9;">
          <h4 style="margin-top:0;">จัดการรายชื่อครู</h4>
          <div style="display:flex; gap:10px; margin-bottom:10px;">
            <input type="text" id="new-teacher-user" placeholder="ชื่อครู">
            <input type="password" id="new-teacher-pass" placeholder="รหัสผ่าน">
            <button onclick="adminAddTeacher()" style="padding:0 15px; background:#00b894; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">เพิ่ม</button>
          </div>
          <table class="teacher-table">
            <thead>
              <tr><th>ชื่อผู้ใช้ครู</th><th style="width: 70px;">จัดการ</th></tr>
            </thead>
            <tbody id="admin-teacher-list"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY4vdnTjB9hHFvrc28Rry6NfvLBJex22pR-Ir7psRSZFHhT-22PuSkMMH4YHQVf_4F/exec";

    function switchPage(page) {
      document.querySelectorAll('.card').forEach(c => c.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('page-' + page).classList.remove('hidden');
      
      const btns = document.querySelectorAll('.nav-btn');
      if(page === 'form') btns[0].classList.add('active');
      if(page === 'teacher') btns[1].classList.add('active');
      if(page === 'admin') btns[2].classList.add('active');
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        document.getElementById('file-label').innerText = "เลือกไฟล์: " + file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('img-preview');
          img.src = e.target.result;
          img.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }

    function getBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function sendData() {
      const btn = document.getElementById("submitBtn");
      const sender = document.getElementById("sender").value.trim();
      const area = document.getElementById("area").value;
      const classVal = document.getElementById("classVal").value;
      const fileInput = document.getElementById("imageFile");

      if (!sender || !area || !classVal || fileInput.files.length === 0) {
        alert("กรุณากรอกข้อมูลให้ครบทุกช่อง และแนบรูปภาพด้วยครับ");
        return;
      }

      btn.disabled = true;
      btn.innerText = "กำลังส่งข้อมูล...";

      try {
        const imageBase64 = await getBase64(fileInput.files[0]);
        const payload = {
          action: "submit_inspection",
          sender: sender,
          area: area,
          class: classVal,
          status: "รอครูตรวจ",
          score: "-",
          image: imageBase64
        };

        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        alert("🎉 บันทึกข้อมูลเรียบร้อยแล้ว!");
        document.getElementById("inspectionForm").reset();
        document.getElementById("img-preview").style.display = 'none';
        document.getElementById('file-label').innerText = "กดเลือกรูปภาพแนบไฟล์";
      } catch (error) {
        alert("เกิดข้อผิดพลาด: " + error);
      } finally {
        btn.disabled = false;
        btn.innerText = "ส่งข้อมูลตรวจความสะอาด";
      }
    }

    function toggleTeacherAuth(mode) {
      if(mode === 'login') {
        document.getElementById('form-teacher-login').classList.remove('hidden');
        document.getElementById('form-teacher-reg').classList.add('hidden');
        document.getElementById('tab-login-btn').classList.add('active');
        document.getElementById('tab-reg-btn').classList.remove('active');
      } else {
        document.getElementById('form-teacher-login').classList.add('hidden');
        document.getElementById('form-teacher-reg').classList.remove('hidden');
        document.getElementById('tab-login-btn').classList.remove('active');
        document.getElementById('tab-reg-btn').classList.add('active');
      }
    }

    function registerTeacherInline() {
      const u = document.getElementById("teacher-reg-user").value.trim();
      const p = document.getElementById("teacher-reg-pass").value.trim();

      if(!u || !p) { alert("กรุณากรอกชื่อผู้ใช้และรหัสผ่านให้ครบครับ"); return; }

      localStorage.setItem("teacher_" + u, p);
      alert("🎉 สมัครสมาชิกครูสำเร็จ!");
      document.getElementById("teacher-reg-user").value = "";
      document.getElementById("teacher-reg-pass").value = "";
      toggleTeacherAuth('login');
      document.getElementById("teacher-login-user").value = u;
    }

    function loginTeacher() {
      const u = document.getElementById("teacher-login-user").value.trim();
      const p = document.getElementById("teacher-login-pass").value.trim();
      const savedPass = localStorage.getItem("teacher_" + u);

      if (savedPass && savedPass === p) {
        document.getElementById("teacher-auth").classList.add("hidden");
        document.getElementById("teacher-panel").classList.remove("hidden");
        document.getElementById("teacher-welcome").innerText = "สวัสดีคุณครู " + u;
      } else {
        alert("ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง!");
      }
    }

    function loginAdmin() {
      const pass = document.getElementById("admin-pass").value.trim();
      if (pass === "8888") {
        document.getElementById("admin-auth").classList.add("hidden");
        document.getElementById("admin-panel").classList.remove("hidden");
        renderAdminTeacherList();
      } else {
        alert("รหัสผ่านไม่ถูกต้อง!");
      }
    }

    function logout(role) {
      if(role === 'teacher') {
        document.getElementById("teacher-auth").classList.remove("hidden");
        document.getElementById("teacher-panel").classList.add("hidden");
      } else {
        document.getElementById("admin-auth").classList.remove("hidden");
        document.getElementById("admin-panel").classList.add("hidden");
      }
    }

    function adminAddTeacher() {
      const u = document.getElementById("new-teacher-user").value.trim();
      const p = document.getElementById("new-teacher-pass").value.trim();
      if(!u || !p) { alert("กรุณากรอกชื่อผู้ใช้และรหัสผ่านครูให้ครบครับ"); return; }

      localStorage.setItem("teacher_" + u, p);
      document.getElementById("new-teacher-user").value = "";
      document.getElementById("new-teacher-pass").value = "";
      alert("เพิ่มบัญชีครูเรียบร้อยแล้ว!");
      renderAdminTeacherList();
    }

    function adminDeleteTeacher(username) {
      if(confirm(`ต้องการลบบัญชีครู "${username}" หรือไม่?`)) {
        localStorage.removeItem("teacher_" + username);
        renderAdminTeacherList();
      }
    }

    function renderAdminTeacherList() {
      const tbody = document.getElementById("admin-teacher-list");
      tbody.innerHTML = "";
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key.startsWith("teacher_")) {
          count++;
          const username = key.replace("teacher_", "");
          tbody.innerHTML += `
            <tr>
              <td>${username}</td>
              <td><button onclick="adminDeleteTeacher('${username}')" style="background:#ff7675; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">ลบ</button></td>
            </tr>
          `;
        }
      }
      if(count === 0) {
        tbody.innerHTML = `<tr><td colspan="2" style="text-align:center; color:#636e72;">ยังไม่มีบัญชีครู</td></tr>`;
      }
    }
  </script>
</body>
</html>
