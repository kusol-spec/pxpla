<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการตรวจและให้คะแนนความสะอาด</title>
    <!-- เรียกใช้ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เรียกใช้ฟอนต์ Sarabun จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // กำหนดโทนสีชมพูหลัก
                        'theme-pink': {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            200: '#fecdd3',
                            300: '#fda4af',
                            400: '#fb7185',
                            50: '#f43f5e', // สีชมพูเข้มสำหรับปุ่ม
                            600: '#e11d48',
                            700: '#be123c',
                        },
                    },
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        /* ตกแต่งเพิ่มเติม */
        body {
            background-color: #fff1f2; /* แบคกราวด์ชมพูอ่อนมาก */
        }
        .form-container {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #fecdd3; /* ขอบชมพูอ่อน */
        }
        /* Style สำหรับ Input แบบ Material */
        .input-group input, .input-group textarea, .input-group select {
            border-color: #fda4af;
        }
        .input-group input:focus, .input-group textarea:focus {
            border-color: #f43f5e;
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
        }
        .input-label {
            color: #be123c;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="max-w-2xl w-full form-container p-8 rounded-3xl shadow-xl">
        <!-- หัวข้อพร้อมไอคอนน่ารัก -->
        <div class="text-center mb-8 border-b-2 border-dashed border-theme-pink-200 pb-6">
            <span class="text-5xl mb-2 block">✨</span>
            <h1 class="text-3xl font-bold text-theme-pink-700">ระบบบันทึกการตรวจ</h1>
            <h2 class="text-xl font-semibold text-theme-pink-500 mt-1">และให้คะแนนความสะอาด</h2>
        </div>

        <form id="checkForm" class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- วันที่ -->
                <div class="input-group">
                    <label class="block input-label font-semibold mb-1.5">📅 วันที่ตรวจ</label>
                    <input type="date" id="inspectionDate" required class="w-full p-3 border-2 rounded-xl outline-none transition duration-150">
                </div>

                <!-- ชั้น / ห้อง -->
                <div class="input-group">
                    <label class="block input-label font-semibold mb-1.5">🏫 ชั้น / ห้อง</label>
                    <input type="text" id="classVal" placeholder="เช่น ม.3/1" class="w-full p-3 border-2 rounded-xl outline-none transition duration-150">
                </div>
            </div>

            <!-- รายชื่อผู้ส่ง / นักเรียน -->
            <div class="input-group">
                <label class="block input-label font-semibold mb-1.5">👤 ชื่อผู้ส่ง / นักเรียน</label>
                <input type="text" id="sender" placeholder="ระบุชื่อนักเรียนหรือตัวแทนกลุ่ม" required class="w-full p-3 border-2 rounded-xl outline-none transition duration-150">
            </div>

            <!-- พื้นที่ / จุดตรวจ -->
            <div class="input-group">
                <label class="block input-label font-semibold mb-1.5">📍 พื้นที่ / บริเวณที่ตรวจ</label>
                <input type="text" id="area" placeholder="เช่น ห้องเรียน, หน้าเสาธง, โรงอาหาร" required class="w-full p-3 border-2 rounded-xl outline-none transition duration-150">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                <!-- ครูผู้ตรวจ -->
                <div class="input-group">
                    <label class="block input-label font-semibold mb-1.5">👩‍🏫 ครูผู้ตรวจ</label>
                    <input type="text" id="checker" placeholder="ระบุชื่อครูผู้ตรวจ" required class="w-full p-3 border-2 rounded-xl outline-none transition duration-150">
                </div>

                <!-- ส่วนให้คะแนน (เด่นชัด) -->
                <div class="bg-theme-pink-100 p-5 rounded-2xl border-2 border-theme-pink-300 shadow-inner">
                    <label class="block text-theme-pink-800 font-bold mb-2 text-center text-lg">💯 คะแนนที่ให้ (0-10)</label>
                    <input type="number" id="score" min="0" max="10" value="10" required 
                        class="w-full p-4 border-2 border-theme-pink-400 rounded-xl focus:ring-4 focus:ring-theme-pink-300 text-3xl font-bold text-center text-theme-pink-600 outline-none bg-white">
                </div>
            </div>

            <!-- หมายเหตุ / ข้อเสนอแนะ -->
            <div class="input-group">
                <label class="block input-label font-semibold mb-1.5">📝 ข้อคิดเห็น / คำแนะนำเพิ่มเติม</label>
                <textarea id="comment" rows="3" placeholder="ใส่รายละเอียดการตรวจหรือสิ่งที่ควรปรับปรุง (ถ้ามี)" 
                    class="w-full p-3 border-2 rounded-xl outline-none transition duration-150 resize-none"></textarea>
            </div>

            <!-- อัปโหลดรูปภาพ -->
            <div class="bg-white p-4 rounded-xl border border-gray-200">
                <label class="block input-label font-semibold mb-2">📸 แนบรูปภาพผลการตรวจ (ถ้ามี)</label>
                <input type="file" id="imageFile" accept="image/*" 
                    class="w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-5 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-theme-pink-100 file:text-theme-pink-700 hover:file:bg-theme-pink-200 file:cursor-pointer">
            </div>

            <!-- ปุ่มบันทึก (สีชมพูเข้ม) -->
            <div class="pt-4">
                <button type="submit" id="submitBtn" 
                    class="w-full bg-theme-pink-500 hover:bg-theme-pink-600 text-white font-bold py-4 px-6 rounded-2xl transition duration-200 shadow-lg text-lg transform hover:scale-[1.02]">
                    🌸 บันทึกการตรวจและคะแนน
                </button>
            </div>
        </form>

        <!-- ส่วนแสดงสถานะ -->
        <div id="statusMessage" class="mt-6 text-center font-semibold p-4 rounded-xl hidden"></div>
        
        <!-- Footer -->
        <div class="text-center mt-10 text-theme-pink-400 text-xs border-t border-dashed border-theme-pink-200 pt-4">
            Powered by Google Apps Script & GitHub Pages
        </div>
    </div>

    <script>
        // ⚠️ วาง URL ที่ได้จากการ Deploy Google Apps Script ของคุณที่นี่ ⚠️
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxY4vdnTjB9hHFvrc28Rry6NfvLBJex22pR-Ir7psRSZFHhT-22PuSkMMH4YHQVf_4F/exec";

        // ตั้งค่าวันที่เริ่มต้นเป็นปัจจุบัน
        document.getElementById('inspectionDate').valueAsDate = new Date();

        // ฟังก์ชันแปลงรูปภาพเป็น Base64
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if (!file) resolve("");
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // จัดการการส่งฟอร์ม
        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMessage');
            
            // เตรียมหน้าต่างแสดงสถานะ
            statusMsg.classList.remove('hidden', 'bg-green-100', 'text-green-700', 'bg-red-100', 'text-red-700', 'bg-blue-100', 'text-blue-700');
            statusMsg.classList.add('bg-blue-100', 'text-blue-700');
            statusMsg.innerHTML = "⏳ กำลังบันทึกข้อมูลและอัปโหลดรูปภาพ โปรดรอสักครู่...";
            
            btn.disabled = true;
            btn.innerHTML = "⏳ กำลังบันทึก...";

            try {
                const fileInput = document.getElementById('imageFile').files[0];
                let imageBase64 = "";
                if (fileInput) {
                    // ตรวจสอบขนาดไฟล์ (เช่น ไม่เกิน 5MB)
                    if (fileInput.size > 5 * 1024 * 1024) {
                        throw new Error("ไฟล์รูปภาพมีขนาดใหญ่เกินไป (ไม่ควรเกิน 5MB)");
                    }
                    imageBase64 = await fileToBase64(fileInput);
                }

                // เตรียมข้อมูลส่งไปยัง Google Apps Script
                const payload = {
                    date: document.getElementById('inspectionDate').value,
                    sender: document.getElementById('sender').value,
                    area: document.getElementById('area').value,
                    class: document.getElementById('classVal').value,
                    checker: document.getElementById('checker').value,
                    score: document.getElementById('score').value,
                    comment: document.getElementById('comment').value,
                    status: "ตรวจแล้ว",
                    image: imageBase64
                };

                // ส่งข้อมูล (ใช้โหมด no-cors เพื่อเลี่ยงปัญหา CORS ชั่วคราว แต่อาจไม่ได้รับ Response กลับมา)
                // แนะนำให้ตั้งค่า CORS ใน Google Apps Script ให้ถูกต้องตามที่แนะนำในรอบก่อนหน้า
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (result.result === 'success') {
                    statusMsg.classList.remove('bg-blue-100', 'text-blue-700');
                    statusMsg.classList.add('bg-green-100', 'text-green-700');
                    statusMsg.innerHTML = "✅ บันทึกข้อมูลและให้คะแนนเรียบร้อยแล้ว! ขอบคุณครับ 🌸";
                    
                    // รีเซ็ตฟอร์ม (ยกเว้นวันที่และชื่อครู)
                    document.getElementById('sender').value = "";
                    document.getElementById('area').value = "";
                    document.getElementById('classVal').value = "";
                    document.getElementById('score').value = "10";
                    document.getElementById('comment').value = "";
                    document.getElementById('imageFile').value = "";
                    
                    // เลื่อนหน้าจอไปที่ข้อความสำเร็จ
                    statusMsg.scrollIntoView({ behavior: 'smooth' });
                    
                    // ซ่อนข้อความสำเร็จหลังจาก 5 วินาที
                    setTimeout(() => {
                        statusMsg.classList.add('hidden');
                    }, 5000);

                } else {
                    throw new Error(result.message || "เกิดข้อผิดพลาดในการบันทึก");
                }
            } catch (err) {
                console.error(err);
                statusMsg.classList.remove('bg-blue-100', 'text-blue-700');
                statusMsg.classList.add('bg-red-100', 'text-red-700');
                statusMsg.innerHTML = "❌ เกิดข้อผิดพลาด: " + err.message + "<br>โปรดลองอีกครั้งหรือติดต่อผู้ดูแลระบบ";
            } finally {
                btn.disabled = false;
                btn.innerHTML = "🌸 บันทึกการตรวจและคะแนน";
            }
        });
    </script>
</body>
</html>
